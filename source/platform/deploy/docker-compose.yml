services:
  gateway: { build: .., command: node gateway/index.js, ports: ["8787:8787"], environment: { AUTH_URL: http://auth:8791, SYNC_URL: http://sync:8792, BILLING_URL: http://billing:8793, AI_URL: http://ai:8794, SOCIAL_URL: http://social:8795, ALLOWED_ORIGINS: "${ALLOWED_ORIGINS}" }, depends_on: [auth, sync, billing, ai, social] }
  auth:    { build: .., command: node services/auth/index.js,    environment: { SESSION_SECRET: "${SESSION_SECRET}", INTERNAL_TOKEN: "${INTERNAL_TOKEN}", GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}", SYNC_URL: http://sync:8792, AUTH_DB: /data/auth.db }, volumes: ["auth:/data"] }
  sync:    { build: .., command: node services/sync/index.js,    environment: { SESSION_SECRET: "${SESSION_SECRET}", INTERNAL_TOKEN: "${INTERNAL_TOKEN}", SYNC_DB: /data/sync.db }, volumes: ["sync:/data"] }
  billing: { build: .., command: node services/billing/index.js, environment: { INTERNAL_TOKEN: "${INTERNAL_TOKEN}", BILLING_DB: /data/billing.db, VOUCHER_PRIVATE_KEY: /keys/voucher_private.pem, PLAY_PACKAGE: "${PLAY_PACKAGE}", PLAY_SERVICE_ACCOUNT: /keys/play-sa.json, RTDN_TOKEN: "${RTDN_TOKEN}" }, volumes: ["billing:/data", "./keys:/keys:ro"] }
  ai:      { build: .., command: node services/ai/index.js,      environment: { INTERNAL_TOKEN: "${INTERNAL_TOKEN}", GEMINI_API_KEY: "${GEMINI_API_KEY}", BILLING_URL: http://billing:8793, AI_DB: /data/ai.db }, volumes: ["ai:/data"] }
  social:  { build: .., command: node services/social/index.js,  environment: { SESSION_SECRET: "${SESSION_SECRET}", INTERNAL_TOKEN: "${INTERNAL_TOKEN}", SOCIAL_DB: /data/social.db }, volumes: ["social:/data"] }
volumes: { auth: {}, sync: {}, billing: {}, ai: {}, social: {} }
