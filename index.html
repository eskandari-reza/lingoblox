<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2f6bff"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>LingoBlox</title><style>:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2330;--mu:#6b7385;--line:#e6e2d8;--ac:#2f6bff;--acs:color-mix(in srgb,var(--ac) 12%,var(--card));--ok:#1f9d6b;--bad:#e5484d;--r:18px;--sh:0 1px 2px rgba(20,25,40,.06),0 6px 20px rgba(20,25,40,.06)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12151c;--card:#1b2029;--ink:#eef0f5;--mu:#98a1b3;--line:#2a3140;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35)}}
:root[data-theme=dark]{--bg:#12151c;--card:#1b2029;--ink:#eef0f5;--mu:#98a1b3;--line:#2a3140;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans","Noto Sans Arabic","Noto Sans JP","Noto Sans KR","Noto Sans SC","Noto Sans Devanagari",sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#root{max-width:560px;margin:0 auto;min-height:100%;position:relative}
.pg{min-height:100vh;display:flex;flex-direction:column;padding:20px 16px 28px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px}
.logo{width:92px;height:92px;border-radius:28px;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#7048e8));display:grid;place-items:center;color:#fff;font-size:44px;font-weight:800;box-shadow:var(--sh)}
.hero h1{margin:0;font-size:30px;letter-spacing:-.5px}
.tag{min-height:3em;color:var(--mu);font-size:17px;max-width:20em;transition:opacity .3s}
.hello{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:22em}
.hello span{padding:4px 10px;border-radius:99px;background:var(--acs);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;border-radius:99px;background:var(--ac);color:#fff;font-weight:700;box-shadow:var(--sh);min-width:160px}
.btn.s{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.sm{padding:9px 16px;min-width:0;font-size:14px}
.btn[disabled]{opacity:.5}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.hd h2{margin:0;font-size:22px;flex:1}
.back{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:18px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lc{background:var(--card);border:2px solid transparent;border-radius:var(--r);padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--sh);font-weight:600;min-width:0}
.lc b{font-size:32px;font-weight:400}.lc span{overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
.lc.on{border-color:var(--ac)}
.lc:active{transform:scale(.97)}
.stp{margin:auto 0;text-align:center}.stp .bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin:18px auto;max-width:300px}.stp .bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .4s}
.stp li{list-style:none;color:var(--mu);padding:3px 0}.stp li.on{color:var(--ink);font-weight:600}.stp li.ok{color:var(--ok)}
.err{color:var(--bad);margin:14px 0}
/* app shell */
.shell{display:flex;flex-direction:column;min-height:100vh;padding-bottom:78px}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
.top h2{margin:0;font-size:20px;flex:1}
.pill{padding:5px 11px;border-radius:99px;background:var(--acs);font-size:13px;font-weight:700;white-space:nowrap}
#view{padding:8px 16px 16px;flex:1}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mu);padding:5px 2px;min-width:0}
.nav button span{font-size:21px}.nav button em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nav button.on{color:var(--ac);font-weight:700}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:16px}
.mu{color:var(--mu)}.sm{font-size:13px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
.cont{background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 60%,#7048e8));color:#fff}
.cont .btn{background:#fff;color:var(--ac);box-shadow:none}
.lv{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;margin:7px 0;font-size:14px}
.lv .b{height:9px;border-radius:9px;background:var(--line);overflow:hidden}.lv .b i{display:block;height:100%;background:var(--ac)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.tile{background:var(--card);border-radius:var(--r);padding:16px 12px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:start;min-width:0}
.tile span{font-size:26px}.tile b{font-size:15px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{padding:6px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.ugrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.u{background:var(--card);border-radius:14px;padding:11px 6px;text-align:center;box-shadow:var(--sh);font-size:13px;position:relative;overflow:hidden}
.u b{display:block;font-size:15px}.u i{position:absolute;left:0;bottom:0;height:4px;background:var(--ok)}
.wr{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line)}
.wr:last-child{border:0}
.wr .t{flex:1;min-width:0}.wr .t b{font-size:18px;display:block;overflow-wrap:anywhere}.wr .t small{color:var(--mu)}
.ck{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;color:#fff;flex:none}.ck.on{background:var(--ok);border-color:var(--ok)}
.wr.ln .t b{color:var(--ok)}
.ib{width:36px;height:36px;border-radius:50%;background:var(--acs);font-size:16px;flex:none}
.fc{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px 16px}
.fc .big{font-size:34px;font-weight:700;overflow-wrap:anywhere}.fc .ex{font-size:14px;color:var(--mu);max-width:22em}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.rate button{padding:12px 4px;border-radius:14px;color:#fff;font-weight:700;font-size:14px}
.opt{display:block;width:100%;text-align:start;padding:13px 14px;margin:8px 0;border-radius:14px;background:var(--card);border:2px solid var(--line);font-size:16px;overflow-wrap:anywhere}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.prog{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-bottom:12px}.prog i{display:block;height:100%;background:var(--ac)}
input[type=search],input[type=text],select{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.modal{position:fixed;inset:0;background:rgba(10,14,22,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px 28px;animation:in .25s}
.sheet h1{margin:0 0 4px;font-size:30px;overflow-wrap:anywhere}
.tg{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--acs);font-size:12px;margin:2px 4px 2px 0}
.sn{padding:9px 0;border-bottom:1px solid var(--line)}.sn:last-child{border:0}
.set{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.set:last-child{border:0}.set>span:first-child{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}.seg button{padding:7px 12px;font-size:13px}.seg .on{background:var(--ac);color:#fff}
[dir=rtl] .back,[dir=rtl] .fl{transform:scaleX(-1)}
.ltr{direction:ltr;unicode-bidi:plaintext}
.gr p{margin:8px 0}.gh1{font-size:20px;margin:0 0 8px}.gh2{margin:16px 0 6px;font-size:16px;color:var(--ac)}
.gex{background:var(--acs);padding:8px 12px;border-radius:12px;margin:6px 0}
.gt{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}.gt td,.gt th{border:1px solid var(--line);padding:6px 8px;text-align:start}.gt th{background:var(--acs)}
.nt{font-size:17px;line-height:1.8}.nw{border-bottom:2px dotted var(--ac);cursor:pointer}
.opt.sel{border-color:var(--ac);background:var(--acs)}
.mc{min-height:74px;border-radius:14px;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#7048e8));color:#fff;font-weight:700;padding:6px;font-size:15px;overflow-wrap:anywhere;box-shadow:var(--sh)}.mc.ok{background:var(--ok)}
.center{text-align:center}

/* v1-style home */

.hhero{background:linear-gradient(135deg,#4728a3,#7b4cfd 60%,#ad82ff);color:#fff;margin:0 -16px;padding:calc(18px + env(safe-area-inset-top)) 16px 22px;border-radius:0 0 28px 28px;box-shadow:0 10px 28px #4728a355}
.hhero h1{margin:0;font-size:24px}.hsub{opacity:.85;font-size:13px;margin-top:2px}
.hchips{display:flex;gap:8px;margin:12px 0;overflow-x:auto;scrollbar-width:none}.hchips::-webkit-scrollbar{display:none}
.hchips span{background:#ffffff26;border:1px solid #ffffff33;padding:6px 13px;border-radius:99px;font-size:13px;font-weight:700;white-space:nowrap}
.hsearch{display:flex;gap:8px;align-items:center;width:100%;background:#fff;color:#8a86a8;border-radius:16px;padding:13px 16px;font-size:15px;box-shadow:0 4px 14px #0002;text-align:start}
.hbody{padding-top:16px}
.hcont{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,#6d3df5,#9d4edd);color:#fff;border-radius:20px;padding:16px 18px;box-shadow:0 8px 22px #6d3df544}
.hcont b{font-size:17px}.hsm{opacity:.9;font-size:13px;margin-top:3px}
.hgo{width:46px;height:46px;border-radius:50%;background:#fff;color:#6d3df5;font-size:16px;flex:none;box-shadow:0 4px 10px #0003}
.hlv{background:var(--card);border-radius:20px;padding:10px 14px;margin:12px 0;box-shadow:var(--sh)}
.hl{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.hl .b{height:8px;border-radius:9px;background:var(--line);overflow:hidden}.hl .b i{display:block;height:100%;background:linear-gradient(90deg,#7b4cfd,#ad82ff)}
.hsec{margin:18px 4px 8px;font-size:16px}
.hgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 6px;background:var(--card);border-radius:22px;padding:16px 8px;box-shadow:var(--sh)}
.ht{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0;text-align:center}
.ht i{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;font-size:27px;font-style:normal;box-shadow:0 6px 14px #0002}
.ht b{font-size:12px;font-weight:600;line-height:1.25;max-width:100%;overflow-wrap:anywhere}
.ht:active i{transform:scale(.94)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .hsearch{background:#1b2029;color:#98a1b3}}
@media(prefers-color-scheme:light){body:has(.hhero){background:#f4f1ff}:root:not([data-theme=dark]) .hlv .b{background:#e8e2fb}}

/* flashcards: v1-style 3D slide cards */
.card3d{perspective:1200px;margin:8px 0;touch-action:pan-y}
.card3{position:relative;height:300px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}.card3.flip{transform:rotateY(180deg)}
.card3 .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;background:var(--card);border:1px solid var(--line);box-shadow:0 14px 40px #0002;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:46px 14px 34px;text-align:center;overflow:hidden}
.card3 .face.bk{transform:rotateY(180deg);background:linear-gradient(135deg,#6d3df5,#ad82ff);color:#fff}
.card3 .big{font-size:clamp(1.8rem,8vw,2.4rem);font-weight:800;overflow-wrap:anywhere}
.card3 .bk .mu{color:#ffffffcc}.card3 .bk .ex{color:#fff;font-size:14px;opacity:.95;max-width:22em}
.fcsp{position:absolute;top:10px;inset-inline-end:12px;width:42px;height:42px;border-radius:50%;background:var(--bg);font-size:18px}
.fch{position:absolute;bottom:10px;left:0;right:0}
.fnav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 8px;direction:ltr}
.fnav button{width:52px;height:52px;border-radius:50%;font-size:1.9rem;line-height:1;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line)}
.fnav #fnx{background:linear-gradient(135deg,#6d3df5,#ad82ff);color:#fff;border:0;box-shadow:0 6px 16px #6d3df555}
.fnav button:disabled{opacity:.4}.ct{flex:1;text-align:center;font-weight:700;color:var(--mu)}
.fctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}.fctl .chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}.fctl .chip:disabled{opacity:.4}
.rate[hidden]{display:none}

/* v1-style bottom nav + hubs */
.nav{border-radius:22px 22px 0 0;box-shadow:0 -6px 24px #4728a31a;border-top:0;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.nav button{border-radius:16px;gap:1px;padding:6px 2px;transition:background .2s}
.nav button.on{background:linear-gradient(135deg,#6d3df522,#ad82ff33);color:#6d3df5}
.nav button.on span{transform:translateY(-1px) scale(1.12)}
.nav button em{font-size:11px}

.hh2{padding-bottom:18px}.hin{width:100%;border:0;margin-top:10px;font:inherit;color:var(--ink)}
.hh2+.hbody{padding-top:16px}

/* settings + profile */
.hrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.hbt{display:flex;gap:8px}.hbt button{width:42px;height:42px;border-radius:14px;background:#ffffff26;border:1px solid #ffffff33;font-size:20px}
.sbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:start}.sbtn b{flex:1}
.set.col{flex-direction:column;align-items:stretch;gap:8px}
.set select,.set input[type=text]{max-width:55%;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.set input[type=range]{width:100%;accent-color:var(--ac)}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;padding:0}.sw button.on{border-color:var(--ink)}
.sw .av{background:var(--bg);font-size:20px;border-color:var(--line)}.sw .av.on{border-color:var(--ac)}
.pfh{display:flex;align-items:center;gap:14px}.pfa{width:64px;height:64px;border-radius:20px;background:#ffffff26;display:grid;place-items:center;font-size:34px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.g3 b{display:block;font-size:24px}.g3 span{font-size:12px;color:var(--mu)}

/* ===== onboarding (7 steps): big message + 3D character in the background ===== */
.pg.ob{position:relative;overflow:hidden;min-height:100dvh;padding:16px 16px 0;background:linear-gradient(180deg,var(--bg),color-mix(in srgb,var(--ac) 14%,var(--bg)))}
.obd{display:flex;gap:6px;justify-content:center;margin:2px 0 14px}.obd i{width:26px;height:6px;border-radius:9px;background:var(--line)}.obd i.d{background:var(--ac);opacity:.55}.obd i.on{background:var(--ac)}
.pg.ob{padding-inline:max(16px,calc((100% - 540px)/2))}
.obb{position:relative;z-index:3;margin-bottom:4px}
.obgd{display:flex;align-items:center;gap:4px;margin:0 0 14px;position:relative;z-index:3}
.obgd.w{flex-direction:column;gap:10px;margin-top:6px}
.obs{position:relative;flex:none;display:grid;place-items:center;pointer-events:auto;cursor:pointer}
.obs canvas{width:100%!important;height:100%!important}
.obm{flex:1;min-width:0;position:relative;font-size:clamp(17px,4.6vw,23px);font-weight:800;line-height:1.45;text-align:start;padding:14px 16px;background:var(--card);border:2px solid var(--line);border-radius:22px;box-shadow:var(--sh)}
.obm::before{content:'';position:absolute;inset-inline-start:-9px;top:50%;margin-top:-8px;width:14px;height:14px;background:var(--card);border-inline-start:2px solid var(--line);border-block-end:2px solid var(--line);transform:rotate(45deg)}
html[dir=rtl] .obm::before{transform:rotate(-45deg)}
.obgd.w .obm{width:100%;flex:none;text-align:center;font-size:clamp(20px,6vw,28px)}
.obgd.w .obm::before{inset-inline-start:50%;top:-9px;margin-inline-start:-7px;margin-top:0;transform:rotate(135deg);border-inline-start:2px solid var(--line);border-block-end:2px solid var(--line)}
html[dir=rtl] .obgd.w .obm::before{transform:rotate(135deg)}
.obm .logo.sm{width:56px;height:56px;font-size:28px;margin:0 auto 8px}
#tg{transition:opacity .25s}
.obc{position:relative;z-index:2;display:flex;flex-direction:column;gap:12px;align-items:stretch;padding-bottom:30px}
.pg.ob .hello{justify-content:center}
.obe{font-size:140px;filter:drop-shadow(0 8px 10px #0003);animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px)}}
.obo{display:flex;align-items:center;gap:12px;padding:18px 18px;border-radius:20px;background:color-mix(in srgb,var(--card) 92%,transparent);border:2px solid var(--line);font-size:20px;font-weight:800;box-shadow:var(--sh);text-align:start;backdrop-filter:blur(4px)}
.obo span{font-size:30px}.obo.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,var(--card))}
.obg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.obg .obo{padding:12px 14px;font-size:17px}
.obr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700;background:color-mix(in srgb,var(--card) 92%,transparent);border-radius:16px;padding:12px 14px}
.btn.big{padding:18px 26px;font-size:20px;align-self:center;min-width:220px}
.obl{background:none;font-weight:700;opacity:.7;padding:10px}
/* ===== nested menus ===== */

.mhd{color:#fff;margin:0 -16px;padding:calc(16px + env(safe-area-inset-top)) 16px 20px;border-radius:0 0 28px 28px;box-shadow:0 10px 28px #0003}
.mrow{display:flex;gap:12px;align-items:center}.mhd h1{margin:0;font-size:26px}.mcr{font-size:12px;opacity:.85;margin-bottom:2px}
.mbk{width:42px;height:42px;border-radius:50%;background:#fff3;color:#fff;font-size:20px;flex:none}
.mbody{padding-top:18px}.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mt{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px 14px;border-radius:22px;background:var(--card);box-shadow:var(--sh);text-align:center;min-width:0;position:relative}
.mt i{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:32px;font-style:normal;box-shadow:0 8px 16px #0003}
.mt b{font-size:15px}.mt.g{border:2px solid color-mix(in srgb,var(--ac) 30%,transparent)}.mt em{font-style:normal;font-size:12px;opacity:.65;position:absolute;top:10px;inset-inline-end:12px}

.tbk{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:17px}
/* ===== new home ===== */
.hh3{padding-bottom:20px}.hbt{display:flex;gap:8px}
.hgoal{display:flex;gap:16px;align-items:center;margin-top:14px}

  const ivl=S=>clamp(Math.round(S/FACTOR*(Math.pow(RETENTION,1/DECAY)-1)),1,MAXI);
  const R=(t,S)=>Math.pow(1+FACTOR*Math.max(0,t)/Math.max(.01,S),DECAY);
  /** normalise any stored entry (legacy [box,due] or full) to {S,D,last,lapses,due} */
  function parse(e,today){
    if(!e)return null;
    if(e.length>=5)return{S:e[2],D:e[3],last:e[4],lapses:e[5]||0,due:e[1]};
    const box=e[0]||1,I=BOX[Math.min(6,Math.max(1,box))];return{S:Math.max(.5,I),D:5,last:e[1]-I,lapses:0,due:e[1]}}
  /** probability of recall today (0..1) */
  function retrievability(e,today){const s=parse(e,today);return s?R(today-s.last,s.S):0}
  function grade(entry,g,today){
    const s=parse(entry,today);let S,D,lapses=0;
    if(!s){S=W[g];D=d0(g);if(g===0){S=W[0]}}
    else{const r=R(today-s.last,s.S);lapses=s.lapses;
      D=clamp(W[7]*d0(2)+(1-W[7])*(s.D-W[6]*(g+1-3)),1,10);
      if(g===0){lapses++;S=Math.min(s.S,W[11]*Math.pow(s.D,-W[12])*(Math.pow(s.S+1,W[13])-1)*Math.exp(W[14]*(1-r)))}
      else{const hp=g===1?W[15]:1,eb=g===3?W[16]:1;S=s.S*(1+Math.exp(W[8])*(11-s.D)*Math.pow(s.S,-W[9])*(Math.exp(W[10]*(1-r))-1)*hp*eb)}}
    S=clamp(S,.1,36500);
    const I=g===0?1:Math.max(g===1?1:2,ivl(S));
    return{entry:[boxOf(I),today+I,+S.toFixed(3),+D.toFixed(3),today,lapses],learned:g>0&&I>=4}}
  const isDue=(entry,today)=>!!entry&&entry[1]<=today;
  /** days until retrievability drops to `p` (default 0.7): sort key for "weakest first" */
  function weakness(entry,today){return 1-retrievability(entry,today)}
  return{BOX,grade,isDue,retrievability,weakness,parse,ivl,W};
});

/* ==== infra/storage.js ==== */
/* INFRA/storage: port + adapter. Same API as localStorage, but never throws and falls back to memory (private mode, blocked storage). */
(()=>{
const mem={};let ls=null;try{ls=window.localStorage;ls.setItem('__t','1');ls.removeItem('__t')}catch(e){ls=null}
const storage={
  getItem(k){try{return ls?ls.getItem(k):(k in mem?mem[k]:null)}catch(e){return k in mem?mem[k]:null}},
  setItem(k,v){try{if(ls)ls.setItem(k,String(v));else mem[k]=String(v)}catch(e){mem[k]=String(v)}},
  removeItem(k){try{ls&&ls.removeItem(k)}catch(e){}delete mem[k]},
  json(k,d){try{const v=this.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  setJson(k,v){this.setItem(k,JSON.stringify(v))}
};

/* ==== infra/content.js ==== */
/* INFRA/content: the app shell knows nothing about the data. Content (skeleton, language packs, lazy extras, 3D engine) is a separate,
   versioned package described by data/manifest.json. Resolution order per item: embedded (single-file build) -> IndexedDB cache
   (valid while its hash matches the manifest) -> network from contentBase. Offline: any cached copy is used even if the manifest is unreachable. */
(()=>{
const cfg=K.get('config'),net=K.get('net');
const base=()=>{let b=cfg.get('contentBase')||'data/';return b.endsWith('/')?b:b+'/'};
let man=null,db=null;
const idb=()=>db||(db=new Promise(ok=>{try{const r=indexedDB.open('rm2content',1);r.onupgradeneeded=()=>r.result.createObjectStore('c');r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)}catch(e){ok(null)}}));
const idbGet=async k=>{const d=await idb();if(!d)return null;return new Promise(ok=>{try{const q=d.transaction('c').objectStore('c').get(k);q.onsuccess=()=>ok(q.result||null);q.onerror=()=>ok(null)}catch(e){ok(null)}})};
const idbPut=async(k,v)=>{const d=await idb();if(!d)return;try{d.transaction('c','readwrite').objectStore('c').put(v,k)}catch(e){}};
async function manifest(){if(man)return man;man=(async()=>{try{const r=await net.fetch(base()+'manifest.json',{cache:'no-cache'});if(r.ok)return await r.json()}catch(e){}return null})();return man}
async function gunzipB64(b){const bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}
/** name: 'lang/de' | 'skeleton' | 'x3d.js' -> file text */
async function text(name){
  const file=/\.(js|json)$/.test(name)?name:name+'.json',ek=name.replace(/\.js$/,'');
  if(window.__EMB&&window.__EMB[ek])return await gunzipB64(window.__EMB[ek]);
  const m=await manifest(),want=m&&m.f&&m.f[file]?m.f[file][0]:null,c=await idbGet(file);
  if(c&&(!want||c.h===want))return c.t;
  try{const r=await net.fetch(base()+file);if(!r.ok)throw new Error(file+' '+r.status);const t=await r.text();idbPut(file,{h:want||'',t});return t}
  catch(e){if(c)return c.t;throw e}
}
K.provide('content',{text,json:async n=>JSON.parse(await text(n)),manifest,base});
})();

/* ==== infra/http.js ==== */
/* INFRA/http: API client for the gateway. Adds bearer token, timeout, uniform {ok,err} results. Never throws. */
(()=>{
const cfg=K.get('config'),st=K.get('storage');
async function req(method,path,body){
  const base=cfg.get('api').replace(/\/$/,'');if(!base)return{ok:false,err:'noapi'};
  const tok=(st.json('rm2auth',{})||{}).token,h={'content-type':'application/json'};if(tok)h.authorization='Bearer '+tok;
  try{const r=await fetch(base+path,{method,headers:h,body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(15000)});const j=await r.json().catch(()=>({}));return Object.assign({status:r.status},j,{ok:r.ok&&j.ok!==false})}
  catch(e){return{ok:false,err:'net'}}}
K.provide('http',{get:p=>req('GET',p),post:(p,b)=>req('POST',p,b),put:(p,b)=>req('PUT',p,b),del:p=>req('DELETE',p)});
})();

/* ==== services/sync.js ==== */
/* SERVICES/sync: pull -> merge (domain/merge) -> push, with optimistic concurrency against the sync microservice. */
(()=>{

const st=document.createElement('style');st.textContent='html.hc{--bg:#000;--card:#000;--ink:#fff;--mu:#e6e6e6;--line:#fff;--ac:#8ab8ff;--ok:#5cf0a8;--bad:#ff8a8a}html.hc .card,html.hc .opt,html.hc .tile{border:2px solid #fff}html.rmo *,html.rmo *::before,html.rmo *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}';document.head.appendChild(st);

const LN=()=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;
async function schedule(){const c=get(),[h,m]=c.time.split(':').map(Number),ln=LN();
  if(ln){try{await ln.cancel({notifications:[{id:7}]});if(c.rem){const pr=await ln.requestPermissions();if(pr.display==='granted')await ln.schedule({notifications:[{id:7,title:'LingoBlox',body:tt('cr_txt'),schedule:{on:{hour:h,minute:m},allowWhileIdle:true}}]})}}catch(e){}}}
function fireWeb(){const c=get();if(!c.rem||LN())return;if(!('Notification'in window)||Notification.permission!=='granted')return;const n=new Date(),[h,m]=c.time.split(':').map(Number),today=n.toLocaleDateString('sv');
  if(c.last===today||n.getHours()*60+n.getMinutes()<h*60+m)return;const p=R.P();if(p&&p.last===today)return;c.last=today;put(c);
  try{if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(r=>r.showNotification('LingoBlox',{body:tt('cr_txt'),icon:'icon-192.png'})).catch(()=>new Notification('LingoBlox',{body:tt('cr_txt')}));else new Notification('LingoBlox',{body:tt('cr_txt')})}catch(e){}}

const head=title=>`<div class="hd"><button class="back" id="bk" aria-label="back">←</button><h2>${esc(title)}</h2></div>`;

/* ==== features/m_castui.js ==== */
/* feature: shows the cast characters (Welcome / Guide / Review roles) on Welcome, Home and review-done screens via kernel events. Emoji only: no WebGL needed. */
(()=>{
const st=K.get('storage'),EMO={leo:'🦁',mimi:'🐱',bani:'🐰',pingo:'🐧'},DEF={welcome:'leo',guide:'mimi',coach:'bani',review:'pingo',listening:'leo'};
const who=r=>EMO[(st.json('rm2cast',{})[r])||DEF[r]]||'🦁';
const chip=(r)=>{const d=document.createElement('div');d.className='castchip';d.textContent=who(r);d.style.cssText='font-size:44px;text-align:center;line-height:1.1;margin:6px 0;animation:castb 2.4s ease-in-out infinite';return d};
const css=document.createElement('style');css.textContent='@keyframes castb{50%{transform:translateY(-6px)}}';document.head.appendChild(css);
K.on('welcome',({el})=>{const h=el.querySelector('.logo');if(h)h.insertAdjacentElement('afterend',chip('welcome'))});
K.on('home',({view})=>{if(!view.querySelector('.castchip')&&st.json('rm2pal',{}).on===false){const c=chip('guide');c.style.fontSize='34px';c.style.textAlign='start';view.prepend(c)}});
K.on('review:done',({view})=>{const b=view.querySelector('.big');if(b)b.textContent=who('review')+' 🎉'});
})();

/* ==== features/m_challenge.js ==== */
/* module: Challenge — Daily (10 mixed, bonus once a day + streak), Classic, Survival (3 lives), Blitz (60 s), Duel (vs bot) */
(()=>{
const localStorage=K.get('storage');
const R=window.RM2,{T,esc,W,show,speak,D,ST}=R,v=()=>R.view();
const KEY='rm2ch',get=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}}},set=o=>{try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}};
const rec=()=>{const o=get();return(o[ST.tgt]=o[ST.tgt]||{d:{last:'',streak:0,score:0,day:0},best:{}}),o};
function rng(seed){let a=0;for(const c of seed)a=(a*31+c.charCodeAt(0))>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const sh=(a,r)=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const nz=s=>R.norm(s).replace(/^(der|die|das|the|a|an|el|la|los|las|le|les|il|lo|gli|um|uma|o|a)\s+/,'').replace(/[^\p{L}\p{N}]/gu,'');
function pool(){const p=R.P(),all=R.allC().filter(c=>W(ST.tgt,c)&&W(ST.src,c)),seen=all.filter(c=>p.learned[c]||p.srs[c]);return{all:seen.length>=12?seen:all.slice(0,300),pos:c=>W(ST.tgt,c)[4]}}
function make(r,P,type){
  const c=P.all[Math.floor(r()*P.all.length)],others=sh(P.all.filter(x=>x!==c),r),opts4=t=>sh([c,...others.slice(0,3)],r).map(x=>({c:x,txt:show(t,x)}));
  if(type==='tm')return{type,c,q:show(ST.tgt,c),say:1,qd:ST.tgt,od:ST.src,opts:opts4(ST.src)};
  if(type==='mt')return{type,c,q:show(ST.src,c),qd:ST.src,od:ST.tgt,opts:opts4(ST.tgt)};
  if(type==='ls')return{type,c,q:'🔊',qd:'ltr',od:ST.src,opts:opts4(ST.src),auto:1};
  return{type:'ty',c,q:show(ST.src,c),qd:ST.src,ans:show(ST.tgt,c)}}
const TYPES={daily:['tm','mt','ls','ty','tm','mt','ls','tm','mt','ty'],classic:['tm','mt','ls','tm','mt','tm','ls','mt','tm','mt']};
function play(mode){
  const P=pool();if(P.all.length<4){v().innerHTML=hd(T('ch_t'))+`<div class="card">${esc(T('few'))}</div>`;return bk(open)}
  const o=rec(),today=R.today(),seed=mode==='daily'?today+ST.tgt+ST.src:String(Math.random()),r=rng(seed);
  const types=TYPES[mode]||TYPES.classic,N=(mode==='sv'||mode==='bz')?1e9:10;
  let i=0,ok=0,lives=3,t=60,bot=0,tm=null,bad=[],lock=0;
  const league=Math.min(8,Math.floor(R.P().xp/400)),pb=.45+league*.06;
  const end=()=>{clearInterval(tm);const R0=rec(),d=R0[ST.tgt];let bonus='';
    if(mode==='daily'){if(d.d.last!==today){const y=new Date(Date.now()-864e5).toLocaleDateString('sv');d.d.streak=d.d.last===y?d.d.streak+1:1;d.d.last=today;d.d.score=ok;R.P().xp+=30+ok*5+Math.min(d.d.streak,7)*5;bonus=T('r_dy',{n:d.d.streak})}else{bonus=T('r_dy2');R.P().xp+=ok}}
    else{R.P().xp+=ok*2;if(mode==='sv'||mode==='bz'){const b=d.best[mode]||0;if(ok>b){d.best[mode]=ok;bonus='🏆 '+ok}else bonus='🏆 '+b}}
    if(mode==='dl'){bonus=ok>bot?'🏆':ok===bot?'🤝':'😅'}
    set(R0);R.save();
    v().innerHTML=hd(T('ch_t'))+`<div class="card fc"><div class="big">${ok}${N<1e9?'/'+N:''}</div>${mode==='dl'?`<div>👤 ${ok} — 🤖 ${bot}</div>`:''}<div>${esc(bonus)}</div>${bad.length?`<div style="text-align:start;width:100%"><div class="mu sm">${esc(T('tdone'))}</div>${bad.map(c=>`<div class="sn">${esc(show(ST.tgt,c))} — ${esc(show(ST.src,c))}</div>`).join('')}</div>`:''}<div class="row"><button class="btn sm" id="ag">${esc(T('rt'))}</button><button class="btn s sm" id="bk2">${esc(T('back'))}</button></div></div>`;
    bk(open);v().querySelector('#ag').onclick=()=>play(mode);v().querySelector('#bk2').onclick=open};
  const ask=()=>{
    if(i>=N||lives<=0)return end();lock=0;
    const q=make(r,P,mode==='daily'||mode==='classic'?types[i%types.length]:['tm','mt','ls','ty'][Math.floor(r()*4)]);
    const top=`<div class="row" style="margin-bottom:8px"><b>${i+1}${N<1e9?'/'+N:''}</b><span class="sp"></span>${mode==='sv'?'❤️'.repeat(lives):''}${mode==='bz'?'⏱ <b id="tt">'+t+'</b>':''}${mode==='dl'?'👤 '+ok+' · 🤖 '+bot:''}</div>`;
    const done=(good)=>{if(lock)return;lock=1;if(good)ok++;else{bad.push(q.c);if(mode==='sv')lives--}if(mode==='dl'&&Math.random()<pb)bot++;speak(W(ST.tgt,q.c)[0],ST.tgt);
      const fb=v().querySelector('#fb');fb.innerHTML=`<div class="card" style="text-align:center;margin-top:8px">${good?'✅ '+esc(T('ok')):'❌ '+esc(T('no'))+'<b class="ltr"> '+esc(show(ST.tgt,q.c))+'</b>'}</div><button class="btn" style="width:100%;margin-top:6px" id="nx">${esc(T('nx'))} →</button>`;v().querySelector('#nx').onclick=()=>{i++;ask()};if(mode==='bz'){setTimeout(()=>{i++;ask()},350)}};
    if(q.type==='ty'){
      v().innerHTML=hd(T('ch_t'))+top+`<div class="card fc" style="min-height:110px"><div class="mu sm">${esc(T('q4'))}</div><div class="big ltr" dir="${D.P[ST.src].dir}">${esc(q.q)}</div></div><input type="text" id="ty" class="ltr" autocomplete="off" autocapitalize="off" style="margin:8px 0"><button class="btn" style="width:100%" id="ck">${esc(T('chk'))}</button><div id="fb"></div>`;
      const go=()=>done(nz(v().querySelector('#ty').value)===nz(q.ans));v().querySelector('#ck').onclick=go;v().querySelector('#ty').onkeydown=e=>{if(e.key==='Enter')go()};setTimeout(()=>{const e=v().querySelector('#ty');e&&e.focus()},50)}
    else{
      v().innerHTML=hd(T('ch_t'))+top+`<div class="card fc" style="min-height:110px">${q.type==='ls'?`<button class="ib" id="pl" style="width:64px;height:64px;font-size:28px">🔊</button>`:`<div class="big ltr" dir="${D.P[q.qd]?D.P[q.qd].dir:'ltr'}">${esc(q.q)}</div>${q.say?`<button class="ib" id="pl">🔊</button>`:''}`}</div>${q.opts.map(x=>`<button class="opt ltr" dir="${D.P[q.od].dir}" data-o="${x.c}">${esc(x.txt)}</button>`).join('')}<div id="fb"></div>`;
      const pl=v().querySelector('#pl');if(pl)pl.onclick=e=>{e.stopPropagation();speak(W(ST.tgt,q.c)[0],ST.tgt)};if(q.auto)speak(W(ST.tgt,q.c)[0],ST.tgt);
      v().onclick=e=>{const b=e.target.closest('.opt');if(!b||lock)return;const g=+b.dataset.o===q.c;b.classList.add(g?'ok':'no');if(!g){const a=v().querySelector(`.opt[data-o="${q.c}"]`);a&&a.classList.add('ok')}done(g)}}
    bk(()=>{clearInterval(tm);open()})};
  if(mode==='bz'){tm=setInterval(()=>{if(!document.getElementById('tt')&&!v().querySelector('.opt,#ty')){clearInterval(tm);return}t--;const e=document.getElementById('tt');if(e)e.textContent=t;if(t<=0){clearInterval(tm);end()}},1000)}
  ask()}
const hd=t=>`<div class="hd"><button class="back" id="bk">←</button><h2>⚔️ ${esc(t)}</h2></div>`;
const bk=f=>{const b=v().querySelector('#bk');if(b)b.onclick=f};
function open(){
  const o=rec(),d=o[ST.tgt],done=d.d.last===R.today();
  v().innerHTML=hd(T('ch_t'))+`<div class="card cont"><h3 style="font-size:19px">${esc(T('md_dy'))}</h3><div style="opacity:.9;margin-bottom:10px">${esc(T('md_d_dy'))}</div><div style="margin-bottom:10px">${esc(T('r_dy',{n:d.d.streak}))}${done?' · ✓ '+d.d.score+'/10':''}</div><button class="btn" data-m="daily">${done?esc(T('rt')):esc(T('pr'))} →</button></div>`+
  [['classic','🎯','md_cl','md_d_cl'],['sv','💀','md_sv','md_d_sv'],['bz','⚡','md_bz','md_d_bz'],['dl','🤖','md_dl','md_d_dl']].map(([m,i,t,dd])=>`<button class="card row" style="width:100%;text-align:start" data-m="${m}"><span style="font-size:28px">${i}</span><div class="t sp"><b>${esc(T(t))}</b><div class="mu sm">${esc(T(dd))}</div></div>${d.best[m]?`<span class="pill">🏆 ${d.best[m]}</span>`:''}</button>`).join('');
  bk(R.home);v().onclick=e=>{const b=e.target.closest('[data-m]');if(b)play(b.dataset.m)}}
R.tiles.push({icon:'⚔️',label:()=>T('ch_t'),open});

/* ---- hangman ---- */
function hang(){

['de4','A2',['Perfect tense: haben / sein + participle','ماضی نقلی: haben / sein + اسم مفعول'],['Most verbs form the perfect with haben. Verbs of movement or change of state (fahren, gehen, bleiben) use sein.','بیشتر فعل‌ها با haben ماضی نقلی می‌سازند. فعل‌های حرکت و تغییر حالت (fahren، gehen، bleiben) با sein می‌آیند.'],[['Ich|habe|gestern|Pizza|gegessen.','I ate pizza yesterday.','دیروز پیتزا خوردم.'],['Wir|sind|nach|Wien|gefahren.','We went to Vienna.','ما به وین رفتیم.'],['Sie|ist|zu|Hause|geblieben.','She stayed at home.','او در خانه ماند.']],[['Ich ___ gestern Pizza gegessen.','habe','bin','hat'],['Wir ___ nach Wien gefahren.','sind','haben','hat'],['Er ___ den Film gesehen.','hat','ist','haben'],['Sie ___ zu Hause geblieben.','ist','hat','sind']]],
['de5','A2',['"weil": verb at the end','weil: فعل به آخر می‌رود'],['After "weil" (because) the conjugated verb goes to the end of the clause: ..., weil ich müde bin.','بعد از weil (چون) فعل صرف‌شده به آخر جمله می‌رود: ..., weil ich müde bin.'],[['Ich|bleibe|zu|Hause,|weil|ich|krank|bin.','I stay at home because I am ill.','در خانه می‌مانم چون بیمارم.'],['Er|kommt|nicht,|weil|er|müde|ist.','He is not coming because he is tired.','او نمی‌آید چون خسته است.'],['Wir|lernen,|weil|wir|Deutsch|brauchen.','We learn because we need German.','ما یاد می‌گیریم چون به آلمانی نیاز داریم.']],[['Ich lerne Deutsch, ___','weil ich in Berlin arbeite.','weil arbeite ich in Berlin.','weil ich arbeite in Berlin.'],['Er kommt nicht, ___','weil er krank ist.','weil ist er krank.','weil er ist krank.'],['Wir bleiben hier, ___','weil es regnet.','weil regnet es.','weil es regnen.'],['Sie lacht, ___','weil der Film lustig ist.','weil ist der Film lustig.','weil der Film ist lustig.']]]
];

['fr1','A1',['être and avoir','être و avoir'],['Être (to be) and avoir (to have) are the two most important verbs: je suis, tu es, il est, nous sommes · j\'ai, tu as, il a, nous avons.','être (بودن) و avoir (داشتن) مهم‌ترین فعل‌ها هستند: je suis، tu es، il est، nous sommes · j\'ai، tu as، il a، nous avons.'],[['Je|suis|étudiant.','I am a student.','من دانشجو هستم.'],['Nous|avons|deux|enfants.','We have two children.','ما دو فرزند داریم.'],['Elle|est|française.','She is French.','او فرانسوی است.']],[['Je ___ étudiant.','suis','ai','est'],['Nous ___ deux enfants.','avons','sommes','avez'],['Elle ___ française.','est','a','sont'],['Ils ___ faim.','ont','sont','est']]],
['fr2','A1',['Articles: le / la / les, un / une','حرف تعریف: le / la / les، un / une'],['Nouns are masculine or feminine: le / un (masculine), la / une (feminine), les (plural). Before a vowel le and la become l\'.','اسم‌ها مذکر یا مؤنث‌اند: le / un (مذکر)، la / une (مؤنث)، les (جمع). قبل از مصوت le و la به l\' تبدیل می‌شوند.'],[['Le|livre|est|sur|la|table.','The book is on the table.','کتاب روی میز است.'],['J\'ai|une|amie|à|Paris.','I have a friend in Paris.','من در پاریس دوستی دارم.'],['Les|enfants|jouent.','The children are playing.','بچه‌ها بازی می‌کنند.']],[['___ livre est sur la table.','Le','La','Les'],['J\'ai ___ amie à Paris.','une','un','le'],['___ enfants jouent.','Les','Le','La'],['Il y a ___ chat dans le jardin.','un','une','les']]],
['fr3','A1',['Adjective agreement','مطابقت صفت'],['Adjectives agree with the noun: add -e for feminine (petite), -s for plural (grands). Adjectives already ending in -s or -x stay the same in the plural (heureux).','صفت با اسم مطابقت می‌کند: برای مؤنث e (petite) و برای جمع s (grands). صفت‌هایی که به s یا x ختم می‌شوند در جمع ثابت می‌مانند (heureux).'],[['Une|maison|petite.','A small house.','یک خانهٔ کوچک.'],['Elle|est|contente.','She is happy.','او خوشحال است.'],['Ils|sont|grands.','They are tall.','آن‌ها قدبلندند.']],[['Une maison ___.','petite','petit','petits'],['Des amis ___.','heureux','heureuse','heureuses'],['Elle est ___.','contente','content','contents'],['Ils sont ___.','grands','grand','grande']]],
['fr4','A1',['Negation: ne … pas','نفی: ne … pas'],['Put ne before the verb and pas after it: je ne parle pas. Before a vowel ne becomes n\': il n\'a pas.','ne قبل از فعل و pas بعد از آن می‌آید: je ne parle pas. قبل از مصوت ne به n\' تبدیل می‌شود: il n\'a pas.'],[['Je|ne|parle|pas|allemand.','I do not speak German.','من آلمانی صحبت نمی‌کنم.'],['Il|ne|prend|pas|le|métro.','He does not take the metro.','او مترو سوار نمی‌شود.'],['Elle|n\'a|pas|de|voiture.','She does not have a car.','او ماشین ندارد.']],[['Je ___ allemand.','ne parle pas','parle ne pas','pas parle'],['Il ___ le métro.','ne prend pas','prend ne pas','ne pas prend'],['Nous ___ ce soir.','ne sortons pas','sortons ne pas','pas ne sortons'],['Elle ___ de voiture.','n\'a pas','ne a pas','a n\'pas']]],
['fr5','A2',['Passé composé','ماضی نقلی (passé composé)'],['Past events use avoir or être + past participle. Verbs of movement (aller, partir, venir) use être, and the participle then agrees with the subject: elle est allée.','برای گذشته از avoir یا être + اسم مفعول استفاده می‌شود. فعل‌های حرکتی (aller، partir، venir) با être می‌آیند و اسم مفعول با فاعل مطابقت می‌کند: elle est allée.'],[['J\'ai|mangé|une|pomme.','I ate an apple.','من یک سیب خوردم.'],['Elle|est|allée|au|cinéma.','She went to the cinema.','او به سینما رفت.'],['Nous|avons|vu|le|film.','We saw the film.','ما فیلم را دیدیم.']],[['J\'___ mangé une pomme.','ai','suis','avons'],['Elle est ___ au cinéma.','allée','allé','aller'],['Nous avons ___ le film.','vu','voir','voyons'],['Ils ___ partis.','sont','ont','est']]]
];

az:[P('Mənim günüm','A1','Səhər yuxudan dururam.','Bir fincan çay içirəm.','Günəş isti və sarıdır,','yaxşı gün məni gözləyir.'),P('Yağış','A2','Yağış pəncərəyə yağır,','küçə boz və islaqdır.','Evdə qalıb kitab oxuyuram,','ürəyim rahat və şaddır.'),P('Kiçik addımlar','B1','Tələsməyə ehtiyac yoxdur,','yol uzun və genişdir.','Bir addım yüz addıma çevrilər,','əgər dayanmadan getsən.'),P('Liman','B2','Fənərlər liman divarında titrəyirdi,','uzaq gəmilər dumanda əriyirdi;','getməkdən danışdıq, getmədik,','və borc alınmış sakit günləri saydıq.')],
de:[P('Mein Tag','A1','Am Morgen wache ich auf.','Ich trinke eine Tasse Tee.','Die Sonne ist warm und gelb,','ein guter Tag wartet auf mich.'),P('Der Regen','A2','Der Regen fällt ans Fenster,','die Straße ist grau und nass.','Ich bleibe zu Hause und lese,','und das Herz ist ruhig und froh.'),P('Kleine Schritte','B1','Du musst dich nicht beeilen,','der Weg ist lang und weit.','Ein Schritt wird zu hundert,','wenn du mit Mut weitergehst.'),P('Der Hafen','B2','Die Laternen zitterten an der Hafenmauer,','während ferne Schiffe im Dunst verschwammen;','wir sprachen vom Gehen und gingen doch nie','und zählten die stillen, geliehenen Tage.')],
es:[P('Mi día','A1','Por la mañana me despierto.','Bebo una taza de té.','El sol es cálido y amarillo,','un buen día me espera.'),P('La lluvia','A2','La lluvia cae en la ventana,','la calle está gris y mojada.','Me quedo en casa y leo un libro,','y mi corazón está tranquilo.'),P('Pequeños pasos','B1','No hace falta que te apures,','el camino es largo y ancho.','Un paso se vuelve cien','si sigues andando con ánimo.'),P('El puerto','B2','Los faroles temblaban en el muelle,','mientras barcos lejanos se disolvían en la bruma;','hablamos de partir, aunque nunca lo haríamos,','y contamos los días quietos, prestados.')],
fr:[P('Ma journée','A1','Le matin, je me réveille.','Je bois une tasse de thé.','Le soleil est chaud et jaune,','une belle journée m’attend.'),P('La pluie','A2','La pluie tombe sur la fenêtre,','la rue est grise et mouillée.','Je reste chez moi et je lis,','et mon cœur est tranquille.'),P('Petits pas','B1','Tu n’as pas besoin de te presser,','la route est longue et large.','Un pas devient cent pas','si tu continues avec courage.'),P('Le port','B2','Les lanternes tremblaient sur le quai,','tandis que des navires lointains se fondaient dans la brume ;','nous parlions de partir sans jamais le faire,','et comptions les jours calmes, empruntés.')],
hi:[P('मेरा दिन','A1','सुबह मैं उठता हूँ।','मैं एक कप चाय पीता हूँ।','सूरज गरम और पीला है,','एक अच्छा दिन मेरा इंतज़ार करता है।'),P('बारिश','A2','खिड़की पर बारिश गिरती है,','सड़क भूरी और गीली है।','मैं घर पर किताब पढ़ता हूँ,','और मेरा मन शांत है।'),P('छोटे कदम','B1','जल्दी करने की ज़रूरत नहीं,','रास्ता लंबा और चौड़ा है।','एक कदम सौ कदम बन जाता है','अगर तुम हिम्मत से चलते रहो।'),P('बंदरगाह','B2','बंदरगाह की दीवार पर लालटेनें काँप रही थीं,','दूर के जहाज़ धुंध में घुल रहे थे;','हमने जाने की बात की, पर गए नहीं,','और उधार के शांत दिन गिनते रहे।')],
it:[P('La mia giornata','A1','La mattina mi sveglio.','Bevo una tazza di tè.','Il sole è caldo e giallo,','una bella giornata mi aspetta.'),P('La pioggia','A2','La pioggia cade sulla finestra,','la strada è grigia e bagnata.','Resto a casa e leggo un libro,','e il mio cuore è tranquillo.'),P('Piccoli passi','B1','Non serve avere fretta,','la strada è lunga e larga.','Un passo diventa cento','se continui a camminare con coraggio.'),P('Il porto','B2','Le lanterne tremavano sul molo,','mentre navi lontane si perdevano nella foschia;','parlammo di partire, senza farlo mai,','e contammo i giorni quieti, presi in prestito.')],
ja:[P('私の一日','A1','朝、起きます。','お茶を一杯飲みます。','太陽はあたたかくて黄色い。','いい一日が待っています。'),P('雨','A2','窓に雨が降っています。','道は灰色でぬれています。','家で本を読みます。','心はしずかでうれしいです。'),P('小さな一歩','B1','急ぐ必要はありません。','道は長くて広いのです。','一歩は百歩になります。','勇気をもって歩き続ければ。'),P('港','B2','港の壁で灯りが震えていた。','遠い船は霞のなかへ溶けていく。','旅立ちを語ったが、行きはしなかった。','借りものの静かな日々を数えた。')],
ko:[P('나의 하루','A1','아침에 일어납니다.','차 한 잔을 마셔요.','해가 따뜻하고 노랗습니다.','좋은 하루가 기다립니다.'),P('비','A2','창문에 비가 내려요.','길은 회색이고 젖었어요.','집에서 책을 읽어요.','마음이 조용하고 기뻐요.'),P('작은 걸음','B1','서두를 필요는 없어요.','길은 길고 넓어요.','한 걸음이 백 걸음이 돼요','용기를 갖고 계속 걸으면.'),P('항구','B2','등불이 항구 벽에서 떨리고 있었다.','먼 배들은 안개 속으로 녹아들었다.','떠나자고 말했지만 떠나지 않았고,','빌려 온 고요한 날들을 세었다.')],
pt:[P('O meu dia','A1','De manhã eu acordo.','Bebo uma chávena de chá.','O sol é quente e amarelo,','um bom dia espera por mim.'),P('A chuva','A2','A chuva cai na janela,','a rua está cinzenta e molhada.','Fico em casa a ler um livro,','e o meu coração está tranquilo.'),P('Pequenos passos','B1','Não precisas de ter pressa,','o caminho é longo e largo.','Um passo torna-se cem','se continuares a andar com coragem.'),P('O porto','B2','As lanternas tremiam no cais,','enquanto navios distantes se dissolviam na bruma;','falámos de partir, sem nunca partir,','e contámos os dias calmos, emprestados.')],
ru:[P('Мой день','A1','Утром я просыпаюсь.','Я пью чашку чая.','Солнце тёплое и жёлтое,','хороший день ждёт меня.'),P('Дождь','A2','Дождь стучит в окно,','улица серая и мокрая.','Я сижу дома и читаю книгу,','и на сердце спокойно.'),P('Маленькие шаги','B1','Не нужно спешить,','дорога длинная и широкая.','Один шаг станет сотней,','если идти вперёд с отвагой.'),P('Гавань','B2','Фонари дрожали на стене гавани,','а дальние корабли таяли в дымке;','мы говорили об отъезде, но не уезжали,','и считали тихие, взятые взаймы дни.')],
tr:[P('Benim günüm','A1','Sabah uyanırım.','Bir bardak çay içerim.','Güneş sıcak ve sarı,','güzel bir gün beni bekliyor.'),P('Yağmur','A2','Yağmur cama yağıyor,','sokak gri ve ıslak.','Evde kalıp kitap okuyorum,','kalbim sakin ve mutlu.'),P('Küçük adımlar','B1','Acele etmene gerek yok,','yol uzun ve geniş.','Bir adım yüz adım olur,','cesaretle yürümeye devam edersen.'),P('Liman','B2','Fenerler liman duvarında titriyordu,','uzak gemiler sisin içinde eriyordu;','gitmekten söz ettik ama gitmedik,','ödünç alınmış sakin günleri saydık.')],
zh:[P('我的一天','A1','早上我起床。','我喝一杯茶。','太阳又暖又黄，','美好的一天在等我。'),P('下雨','A2','雨落在窗户上，','街道又灰又湿。','我在家里看书，','心里很平静。'),P('小小的脚步','B1','不必着急，','路又长又宽。','一步会变成一百步，','只要你勇敢地走下去。'),P('港口','B2','灯笼在港口的墙上颤抖，','远处的船消失在薄雾里；','我们谈起离开，却从未离开，','只是数着借来的安静日子。')]
};
})();

function shadow(){stopAll();const S=sents(1,3,12)[0];if(!S)return none();let url=null,mr=null,chunks=[],stream=null;

const dirT=()=>(D.P[ST.tgt]||{}).dir||'ltr',JOIN=()=>/^(ja|zh)$/.test(ST.tgt)?'':' ',L2=()=>ST.src==='fa'?1:0;
const shuf=a=>[...a].sort(()=>Math.random()-.5);
function feed(n,render,bind,back,start,onView,setup){
  const o=document.createElement('div');o.className='reel wreel pfeed';
  o.innerHTML=`<button class="rclose" aria-label="close">✕</button><div class="rpager">${Array.from({length:n},(_,i)=>`<section class="rp" data-i="${i}" style="--c:var(--g${i%6})"><div class="gp">${render(i)}</div></section>`).join('')}</div>`;
  document.body.appendChild(o);document.body.style.overflow='hidden';R.rth.btn(o);setup&&setup(o);const pg=o.querySelector('.rpager');let cur=-1;
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const i=+e.target.dataset.i;if(i!==cur){cur=i;try{speechSynthesis.cancel()}catch(x){}onView&&onView(i)}}}),{root:pg,rootMargin:'-45% 0px -45% 0px',threshold:0});
  o.querySelectorAll('.rp').forEach(el=>io.observe(el));
  const close=()=>{io.disconnect();try{speechSynthesis.cancel()}catch(e){}o.remove();document.body.style.overflow='';document.removeEventListener('keydown',kd);back&&back()};
  const kd=e=>{if(e.key==='Escape')close();else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();pg.scrollBy({top:(e.key==='ArrowDown'?1:-1)*pg.clientHeight,behavior:'smooth'})}};
  document.addEventListener('keydown',kd);o.querySelector('.rclose').onclick=close;o.onclick=e=>{const rb=e.target.closest('.arail');if(rb&&o._rail){o._rail(e,+rb.dataset.ai);return}bind(e,o)};
  requestAnimationFrame(()=>{pg.scrollTop=RM2.rpTop(pg,start||0)})}
/* ---- grammar posts ---- */
const GP=()=>(window.RMG||{})[ST.tgt]||[];
const gex=e=>e[0].split('|').join(JOIN()),ggl=e=>ST.src==='fa'?(e[2]||e[1]):(ST.tgt==='en'?'':e[1]);
const git=i=>{const p=GP()[i];return{id:'g'+p[0],gi:i,name:p[2][L2()],desc:p[3][L2()],shareTitle:p[2][L2()],shareText:p[3][L2()],shareLines:p[4].slice(0,3).map(gex)}};
function ruleBody(i){const p=GP()[i],q=p[5].length?p[5][i%p[5].length]:null,sd=(D.P[ST.src]||{}).dir||'ltr';
  return`<h1 class="gh" dir="auto">${esc(p[2][L2()])}</h1><p class="gpr" dir="auto">${esc(p[3][L2()])}</p>
  <h4 class="gsec">${esc(T('sent'))}</h4><div class="gpx">${p[4].map((e,k)=>`<button data-s="${i}:${k}"><span class="gtx" dir="${dirT()}">${esc(gex(e))}</span>${ggl(e)?`<small dir="${sd}">${esc(ggl(e))}</small>`:''}<i>🔊</i></button>`).join('')}</div>
  ${q?`<h4 class="gsec">${esc(T('pr'))}</h4><div class="gpq" data-q="${i}"><div class="gpqs" dir="${dirT()}">${esc(q[0])}</div><div class="gpo">${shuf([q[1],q[2],q[3]]).map(o=>`<button data-o="${esc(o)}" dir="${dirT()}">${esc(o)}</button>`).join('')}</div></div>`:''}`}
function ruleBind(e){const P=GP(),s=e.target.closest('[data-s]'),b=e.target.closest('[data-o]');
  if(s){const[i,k]=s.dataset.s.split(':').map(Number);speak(gex(P[i][4][k]),ST.tgt);return true}
  if(b){const box=b.closest('.gpq');if(box.dataset.d)return true;box.dataset.d=1;const i=+box.dataset.q,p=P[i],q=p[5][i%p[5].length],ok=b.dataset.o===q[1];
    box.querySelectorAll('[data-o]').forEach(x=>{if(x.dataset.o===q[1])x.classList.add('ok');else if(x===b)x.classList.add('no')});
    if(ok)speak(q[0].replace(/_+/g,q[1]),ST.tgt);K.emit('answer',{ok});R.act.pts(ok?'ok':'no');const pp=R.P();pp.xp+=ok?6:1;R.save();return true}
  return false}
function ruleReel(back,gi){const P=GP();if(!P[gi])return back&&back();
  feed(1,()=>`<div class="gpt"><span class="gpl">${esc(P[gi][1])}</span></div>${ruleBody(gi)}${R.act.rail(git(gi),'gram',gi)}`,(e)=>{ruleBind(e)},back,0,()=>R.act.pts('view','g'+P[gi][0]),o=>{o._rail=(e)=>R.act.onRail(e,git(gi),'gram')})}
/* ---- sentence posts ---- */
function sentReel(ids,back,start){
  const S=(D.P[ST.tgt]||{}).s||[];ids=ids.filter(i=>S[i]);if(!ids.length)return back&&back();
  const six=D.P[ST.src]&&D.P[ST.src].s&&D.P[ST.src].s.length?R.sentIdx(ST.src):null;
  const tr=x=>{const j=six&&six.first[x[2].join(',')];return j!=null&&j!==false?D.P[ST.src].s[j]:null};
  const sit=n=>{const x=S[ids[n]],t=tr(x);return{id:'s'+ids[n],si:ids[n],name:R.fill(x),desc:t?R.fill(t):'',shareTitle:R.fill(x),shareText:t?R.fill(t):''}};
  const render=n=>{const x=S[ids[n]],t=tr(x),c=x[2][0],w=R.W(ST.tgt,c);
    return`<div class="gpt"><span class="gpl">💬</span><span class="mu2">${n+1}/${ids.length}</span></div><div class="gsn" dir="${dirT()}">${esc(R.fill(x))}</div>${t?`<div class="gst">${esc(R.fill(t))}</div>`:''}
    ${w?`<div class="gpx"><button data-w="${c}"><span>${esc(R.show(ST.tgt,c))}</span><small>${esc(R.show(ST.src,c)||'')}</small></button></div>`:''}
    <div class="gact"><button data-p="${n}">🔊</button><button data-p="${n}" data-slow="1">🐢</button></div>${R.act.rail(sit(n),'sent',n)}`};
  const bind=e=>{const p=e.target.closest('[data-p]'),w=e.target.closest('[data-w]');
    if(p){const was=ST.slow;if(p.dataset.slow)ST.slow=true;speak(R.fill(S[ids[+p.dataset.p]]),ST.tgt);ST.slow=was}
    else if(w)R.vWord(+w.dataset.w)};
  feed(ids.length,render,bind,back,start,n=>R.act.pts('view','s'+ids[n]),o=>{o._rail=(e,n)=>R.act.onRail(e,sit(n),'sent')})}

/* ---- daily lesson as posts ---- */
function lessonFeed(blocks,o){
  const S=[];let cur=null;const tdir=o.tdir||dirT();
  blocks.forEach(x=>{
    if(x[0]==='h'&&x[1]===1){if(!cur)cur={h:x[2],items:[],cover:1};else{cur.items.push({t:'h1',x:x[2]})}}
    else if(x[0]==='h'){if(cur)S.push(cur);cur={h:x[2],items:[]}}
    else{if(!cur)cur={h:'',items:[],cover:1};
      if(x[0]==='r'){const l=cur.items[cur.items.length-1];if(l&&l.t==='tb')l.rows.push(x);else cur.items.push({t:'tb',rows:[x]})}
      else cur.items.push({t:x[2]?'ex':'p',x:x[1]})}});
  if(cur)S.push(cur);
  const title=S[0]&&S[0].cover?S[0].h:'';
  if(S[0]&&S[0].cover&&!S[0].items.length&&S.length>1)S.shift();
  const RU=(o.rules||[]).slice(),nl=S.length,n=S.length+RU.length+1;
  const it=i=>i>=nl?git(RU[i-nl]):({id:'l'+o.uid+'_'+i,name:(S[i]&&S[i].h)||title,desc:((S[i]&&S[i].items.find(z=>z.t==='p'))||{}).x||'',shareTitle:(S[i]&&S[i].h)||title,shareText:''});
  const body=s=>s.items.map(z=>z.t==='p'?`<p class="gpr" dir="auto">${esc(z.x)}</p>`:z.t==='h1'?`<h4 class="gsec">${esc(z.x)}</h4>`:z.t==='ex'?`<button class="lex" data-x="${esc(z.x)}"><span dir="${tdir}">${esc(z.x)}</span><i>🔊</i></button>`:`<div class="lft"><table>${z.rows.map(r=>'<tr>'+r[1].map(c=>r[2]?`<th>${esc(c)}</th>`:`<td dir="auto">${esc(c)}</td>`).join('')+'</tr>').join('')}</table></div>`).join('');
  const render=i=>{
    if(i>=nl&&i<n-1)return`<div class="gpt"><span class="gpl">${esc(o.day)} · ${esc((R.grammarT?R.grammarT():''))}</span><span class="mu2">${i+1} / ${n}</span></div>${ruleBody(RU[i-nl])}${R.act.rail(git(RU[i-nl]),'gram',i)}`;
    if(i===n-1)return`<div class="gpt"><span class="gpl">${esc(o.lvl)}</span><span class="mu2">${n} / ${n}</span></div><h1 class="gh" dir="auto">🎉 ${esc(T('done'))}</h1>${o.next?`<button class="lbtn" data-go="1">🎞️ ${esc(o.next[0])} ${esc(o.lvl)} ›</button>`:''}<button class="lbtn alt" data-end="1">✓ ${esc(T('s_gr'))}</button>`;
    const s=S[i];return`<div class="gpt"><span class="gpl">${esc(o.day)}</span><span class="mu2">${i+1} / ${n}</span></div>${title&&s.h&&s.h!==title?`<div class="mu2 ltt" dir="auto">${esc(title)}</div>`:''}<h1 class="gh" dir="auto">${esc(s.h||title)}</h1>${s.cover&&o.fb?`<p class="mu2" dir="auto">${esc(o.fb)}</p>`:''}${body(s)}${R.act.rail(it(i),'gram',i)}`};
  const bind=(e,ov)=>{if(ruleBind(e))return;const x=e.target.closest('[data-x]');if(x)return speak(x.dataset.x,ST.tgt);
    if(e.target.closest('[data-go]')){ov.querySelector('.rclose').click();setTimeout(()=>o.next[1](),30)}
    else if(e.target.closest('[data-end]'))ov.querySelector('.rclose').click()};
  feed(n,render,bind,o.back,0,i=>{if(i<nl)R.act.pts('view','l'+o.uid+'_'+i);else if(i<n-1)R.act.pts('view','g'+GP()[RU[i-nl]][0])},ov=>{ov._rail=(e,i)=>R.act.onRail(e,it(i),'gram')})}
R.lessonFeed=lessonFeed;

/* ---- sample texts as posts: one paragraph per post, tap words, glossary ---- */
function textFeed(o){
  const P=o.paras,n=P.length+1,clean=t=>String(t).replace(/«\d+»/g,''),fs=t=>{const m=clean(t).trim().match(/^.+?[.!?。！？](?=\s|$)/);return m?m[0]:clean(t)};
  const title=P[0]?fs(P[0]):'',sub=o.tr&&o.tr[0]?fs(o.tr[0]):'';
  const it=i=>({id:'t'+o.uid+'_'+i,name:clean(P[i]).slice(0,70),desc:o.tr&&o.tr[i]?clean(o.tr[i]).slice(0,120):'',shareTitle:clean(P[i]).slice(0,70),shareText:clean(P[i])});
  const words=t=>{const seen={},out=[];[...t.matchAll(/«(\d+)»/g)].forEach(m=>{const w=o.word(+m[1]);if(w&&!seen[w.a]){seen[w.a]=1;out.push(w)}});return out};
  const render=i=>{
    if(i===P.length)return`<div class="gpt"><span class="gpl">${esc(o.day)}</span><span class="mu2">${n} / ${n}</span></div><h1 class="gh" dir="auto">🎉 ${esc(T('done'))}</h1><button class="lbtn" data-all="1">🔊 ${esc(T('ntx'))}</button><button class="lbtn alt" data-end="1">✓</button>`;
    const t=P[i],ws=words(t),html=esc(t).replace(/(\S+?)«(\d+)»/g,(m,w,k)=>`<span class="nw" data-n="${k}">${w}</span>`).replace(/«\d+»/g,'');
    return`<div class="gpt"><span class="gpl">${esc(o.day)} · ${esc(o.lvl)}</span><span class="mu2">${i+1} / ${n}</span></div>${i===0?`<h1 class="gh" dir="${o.tdir}">${esc(title)}</h1>${sub?`<div class="mu2 ltt" dir="auto">${esc(sub)}</div>`:''}`:`<div class="mu2 ltt" dir="${o.tdir}">${esc(title)}</div>`}${o.fb&&i===0?`<p class="mu2" dir="auto">${esc(o.fb)}</p>`:''}
    <p class="tx" dir="${o.tdir}">${html}</p>${o.tr&&o.tr[i]?`<p class="gpr" dir="auto">${esc(clean(o.tr[i]))}</p>`:''}
    <div class="gact"><button data-p="${i}">🔊</button><button data-p="${i}" data-slow="1">🐢</button></div>
    ${ws.length?`<h4 class="gsec">${esc(T('wd'))}</h4><div class="gpx">${ws.map(w=>`<button data-sp="${esc(w.sp)}"><span class="gtx" dir="${o.tdir}">${esc(w.a)}</span>${w.b?`<small dir="auto">${esc(w.b)}</small>`:''}<i>🔊</i></button>`).join('')}</div>`:''}${R.act.rail(it(i),'sent',i)}`};
  const bind=(e,ov)=>{const w=e.target.closest('.nw'),sp=e.target.closest('[data-sp]'),pl=e.target.closest('[data-p]');
    if(w){const x=o.word(+w.dataset.n);if(x)speak(x.sp,o.lang);document.querySelectorAll('.reel .nw.on').forEach(z=>z.classList.remove('on'));w.classList.add('on')}
    else if(sp)speak(sp.dataset.sp,o.lang);
    else if(pl){const was=ST.slow;if(pl.dataset.slow)ST.slow=true;speak(clean(P[+pl.dataset.p]),o.lang);ST.slow=was}
    else if(e.target.closest('[data-all]'))speak(clean(P.join(' ')),o.lang);
    else if(e.target.closest('[data-end]'))ov.querySelector('.rclose').click()};
  feed(n,render,bind,o.back,0,i=>{if(i<P.length)R.act.pts('view','t'+o.uid+'_'+i)},ov=>{ov._rail=(e,i)=>R.act.onRail(e,it(i),'sent')})}
R.textFeed=textFeed;R.postFeed=feed;
R.ruleReel=ruleReel;R.sentReel=sentReel;
})();

/* ==== features/m_practicereel.js ==== */
/* module: Practice feed — mixed exercises (meaning, reverse, listening, gap-fill) as full-screen scroll posts with instant feedback */
(()=>{
const R=window.RM2,{T,esc,D,ST,speak,W,show,P,save}=R;
const COL=['#4f46e5,#7c3aed','#0e7490,#0891b2','#be123c,#e11d48','#15803d,#16a34a','#b45309,#d97706','#7e22ce,#c026d3'];
const dir=()=>(D.P[ST.tgt]||{}).dir||'ltr';
const shuf=a=>[...a].sort(()=>Math.random()-.5);
function pool(){const p=P(),have=c=>W(ST.tgt,c)&&W(ST.src,c);let L=Object.keys(p.learned||{}).map(Number).filter(have);
  if(L.length<12){const l0=R.LV.indexOf(p.lv0||'A1');for(const[,lv,cs]of D.sk.units){if(R.LV.indexOf(lv)<l0)continue;for(const c of cs)if(have(c)&&!L.includes(c))L.push(c);if(L.length>=60)break}}
  return L}
function build(n){const ps=pool(),ix=R.sentIdx(ST.tgt),S=D.P[ST.tgt].s,all=shuf(ps),Q=[];
  const opts=(c,f)=>{const o=new Set([f(c)]);for(const d of shuf(ps)){if(o.size>=4)break;const t=f(d);if(t&&!o.has(t))o.add(t)}return shuf([...o])};
  const types=['mean','rev','listen','gap'];let k=0;
  for(const c of all){if(Q.length>=n)break;let t=types[k++%4];
    if(t==='gap'){const si=(ix.by[c]||[]).find(i=>S[i]&&S[i][1].length===1);if(si==null)t='mean';else{const x=S[si],ans=x[1][0],ws=ps.map(d=>(W(ST.tgt,d)||[])[0]).filter(w=>w&&w!==ans);const o=shuf([ans,...shuf(ws).slice(0,3)]);Q.push({t,c,q:R.fill(x,true),ans,o,say:R.fill(x)});continue}}
    if(t==='mean')Q.push({t,c,q:show(ST.tgt,c),ans:show(ST.src,c),o:opts(c,d=>show(ST.src,d)),say:W(ST.tgt,c)[0]});
    else if(t==='rev')Q.push({t,c,q:show(ST.src,c),ans:show(ST.tgt,c),o:opts(c,d=>show(ST.tgt,d)),say:W(ST.tgt,c)[0],tg:1});
    else Q.push({t:'listen',c,q:'🔊',ans:show(ST.tgt,c),o:opts(c,d=>show(ST.tgt,d)),say:W(ST.tgt,c)[0],tg:1})}
  return Q}
const LBL={mean:'pf_mean',rev:'pf_rev',listen:'pf_lis',gap:'ex_c'};
function run(back){
  const Q=build(20);if(Q.length<4){alert(T('few'));return back&&back()}
  let ok=0,done=0;
  const o=document.createElement('div');o.className='reel wreel pfeed pq';
  const page=(q,i)=>`<section class="rp" data-i="${i}" style="--c:var(--g${i%6})"><div class="gp"><div class="gpt"><span class="gpl">${esc(T(LBL[q.t]))}</span><span class="mu2">${i+1}/${Q.length}</span></div><div class="pqq ${q.t==='gap'||q.tg?'':''}" dir="${q.t==='mean'||q.t==='gap'||q.t==='listen'?dir():'auto'}">${q.t==='listen'?'<button class="pqs" data-say="'+i+'">🔊</button>':esc(q.q)}</div><div class="pqo">${q.o.map(x=>`<button data-o="${esc(x)}" dir="${q.tg||q.t==='gap'?dir():'auto'}">${esc(x)}</button>`).join('')}</div>${R.act.rail({id:'w'+q.c,cid:q.c,name:show(ST.tgt,q.c),desc:show(ST.src,q.c),shareTitle:show(ST.tgt,q.c)+' = '+show(ST.src,q.c)},'word',i)}</div></section>`;
  const endp=`<section class="rp" data-i="${Q.length}" style="--c:var(--g2)"><div class="gp" style="align-items:center;text-align:center"><div style="font-size:64px">🎉</div><h1 id="pqe"></h1><button class="gpo-b" id="pqa">🔁</button><button class="gpo-b" id="pqx">✕</button></div></section>`;
  o.innerHTML=`<button class="rclose" aria-label="close">✕</button><div class="pqb">⭐ <b id="pqs">0</b></div><div class="rpager">${Q.map(page).join('')}${endp}</div>`;
  document.body.appendChild(o);document.body.style.overflow='hidden';R.rth.btn(o);const pg=o.querySelector('.rpager');
  const close=()=>{try{speechSynthesis.cancel()}catch(e){}o.remove();document.body.style.overflow='';document.removeEventListener('keydown',kd);back&&back()};
  const kd=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',kd);o.querySelector('.rclose').onclick=close;
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const i=+e.target.dataset.i;if(i===Q.length){o.querySelector('#pqe').textContent=ok+'/'+Q.length;return}const q=Q[i];if(q&&q.t==='listen'&&!q.d)speak(q.say,ST.tgt)}}),{root:pg,rootMargin:'-45% 0px -45% 0px',threshold:0});
  o.querySelectorAll('.rp').forEach(el=>io.observe(el));
  o.onclick=e=>{const rb=e.target.closest('.arail');if(rb){const c=Q[+rb.dataset.ai].c;R.act.onRail(e,{id:'w'+c,cid:c,name:show(ST.tgt,c),desc:show(ST.src,c),shareTitle:show(ST.tgt,c)+' = '+show(ST.src,c)},'word');return}const s=e.target.closest('[data-say]'),b=e.target.closest('[data-o]');
    if(s)speak(Q[+s.dataset.say].say,ST.tgt);
    else if(b){const sec=b.closest('.rp'),i=+sec.dataset.i,q=Q[i];if(q.d)return;q.d=1;const good=b.dataset.o===q.ans;
      sec.querySelectorAll('[data-o]').forEach(x=>{if(x.dataset.o===q.ans)x.classList.add('ok');else if(x===b)x.classList.add('no')});
      if(good)ok++;done++;o.querySelector('#pqs').textContent=ok;K.emit('answer',{ok:good});R.act.pts(good?'ok':'no');const pp=P();pp.xp+=good?6:1;save();speak(q.say,ST.tgt);
      setTimeout(()=>{if(o.isConnected)pg.scrollTo({top:RM2.rpTop(pg,i+1),behavior:'smooth'})},1300)}
    else if(e.target.closest('#pqa')){o.remove();document.body.style.overflow='';document.removeEventListener('keydown',kd);run(back)}
    else if(e.target.closest('#pqx'))close()}}
R.practiceReel=run;
R.tiles.push({icon:'⚡',label:()=>T('pf_t'),open:()=>run(()=>R.home())});
})();

/* ==== features/m_shop.js ==== */
/* module: Shop (local coins + app colors + supporter badge), progress backup (file export/import), community link. No server, no payments. */
(()=>{

['Bonjour ! Que désirez-vous ?','Un café et une part de gâteau, s\'il vous plaît.','Et avec ceci ?','Oui, un verre d\'eau, s\'il vous plaît.','Voilà. Ça fait six euros.','Merci. Voici l\'argent.'],
['Excusez-moi, où est la gare ?','Allez tout droit et tournez à gauche à la banque.','C\'est loin ?','Non, c\'est à dix minutes à pied environ.','Merci beaucoup !','Je vous en prie. Bonne journée !'],
['Salut Sara, tu es libre samedi ?','Je voulais rendre visite à mes parents. Pourquoi ?','Un ami organise une fête et j\'aimerais que tu viennes.','Ça a l\'air sympa. Elle commence à quelle heure ?','À sept heures du soir, chez lui, près du parc.','Je peux voir mes parents le matin, puis venir à la fête.','Parfait ! Je passerai te chercher à six heures et demie.','Super, à samedi !'],
['Je m\'appelle Ali.','J\'habite à Tabriz avec ma famille.','J\'ai un père, une mère et une sœur.','Ma sœur est étudiante.','Nous dînons ensemble tous les soirs.'],
['Je me lève à sept heures.','Je bois du thé et je mange du pain avec du fromage.','Ensuite, je vais au travail en bus.','Je commence à travailler à neuf heures.','J\'aime mon travail.'],
['Hier, je suis allé au marché avec ma mère.','Nous avons acheté des pommes, du pain et du fromage.','Les pommes étaient très bon marché.','Ensuite, nous avons bu du thé dans un petit café.','J\'étais fatigué, mais j\'étais content.','Le soir, nous avons préparé le dîner ensemble.'],
['La semaine dernière, Sara a perdu son téléphone dans le bus.','Elle était très inquiète parce que toutes ses photos étaient dessus.','Elle est allée à la gare routière et a demandé au chauffeur, mais il ne l\'avait pas vu.','Le lendemain, une femme a appelé son numéro.','Elle avait trouvé le téléphone sous un siège.','Sara l\'a remerciée et lui a offert un café.','Depuis, elle vérifie toujours son sac avant de descendre du bus.']],
es:[['¡Hola! ¿Cómo te llamas?','¡Hola! Me llamo Sara. ¿Y tú?','Yo soy Ali. Mucho gusto.','Mucho gusto también. ¿De dónde eres?','Soy de Tabriz, en Irán.','¡Ah, qué bien! Yo soy de Berlín.'],
['¡Buenos días! ¿Qué desea?','Un café y un trozo de tarta, por favor.','¿Algo más?','Sí, un vaso de agua, por favor.','Aquí tiene. Son seis euros.','Gracias. Aquí tiene el dinero.'],
['Perdone, ¿dónde está la estación de tren?','Siga recto y gire a la izquierda en el banco.','¿Está lejos?','No, está a unos diez minutos a pie.','¡Muchas gracias!','De nada. ¡Que tenga un buen día!'],
['Hola, Sara, ¿estás libre el sábado?','Quería visitar a mis padres. ¿Por qué?','Un amigo da una fiesta y me gustaría que vinieras.','Suena bien. ¿A qué hora empieza?','A las siete de la tarde, en su casa, cerca del parque.','Puedo visitar a mis padres por la mañana y luego ir a la fiesta.','¡Perfecto! Paso a recogerte a las seis y media.','¡Genial, nos vemos el sábado!'],
['Me llamo Ali.','Vivo en Tabriz con mi familia.','Tengo un padre, una madre y una hermana.','Mi hermana es estudiante.','Cenamos juntos todas las noches.'],
['Me levanto a las siete.','Tomo té y como pan con queso.','Luego voy al trabajo en autobús.','Empiezo a trabajar a las nueve.','Me gusta mi trabajo.'],
['Ayer fui al mercado con mi madre.','Compramos manzanas, pan y queso.','Las manzanas eran muy baratas.','Luego tomamos té en un café pequeño.','Estaba cansado, pero estaba contento.','Por la noche cocinamos la cena juntos.'],
['La semana pasada Sara perdió el móvil en el autobús.','Estaba muy preocupada porque todas sus fotos estaban en él.','Fue a la estación de autobuses y le preguntó al conductor, pero él no lo había visto.','Al día siguiente una mujer llamó a su número.','Había encontrado el móvil debajo de un asiento.','Sara le dio las gracias y la invitó a un café.','Desde entonces siempre revisa su bolso antes de bajar del autobús.']],
it:[['Ciao! Come ti chiami?','Ciao! Mi chiamo Sara. E tu?','Io sono Ali. Piacere.','Piacere mio. Di dove sei?','Sono di Tabriz, in Iran.','Ah, bello! Io sono di Berlino.'],
['Buongiorno! Cosa desidera?','Un caffè e una fetta di torta, per favore.','Altro?','Sì, un bicchiere d\'acqua, per favore.','Ecco a Lei. Sono sei euro.','Grazie. Ecco i soldi.'],
['Scusi, dov\'è la stazione dei treni?','Vada dritto e giri a sinistra alla banca.','È lontano?','No, sono circa dieci minuti a piedi.','Grazie mille!','Prego. Buona giornata!'],
['Ciao Sara, sei libera sabato?','Volevo andare a trovare i miei genitori. Perché?','Un amico dà una festa e mi piacerebbe che venissi.','Mi sembra bello. A che ora inizia?','Alle sette di sera, a casa sua, vicino al parco.','Posso andare dai miei genitori la mattina e poi venire alla festa.','Perfetto! Passo a prenderti alle sei e mezza.','Fantastico, ci vediamo sabato!'],
['Mi chiamo Ali.','Vivo a Tabriz con la mia famiglia.','Ho un padre, una madre e una sorella.','Mia sorella è una studentessa.','Ceniamo insieme ogni sera.'],
['Mi alzo alle sette.','Bevo il tè e mangio pane con formaggio.','Poi vado al lavoro in autobus.','Comincio a lavorare alle nove.','Mi piace il mio lavoro.'],
['Ieri sono andato al mercato con mia madre.','Abbiamo comprato mele, pane e formaggio.','Le mele costavano pochissimo.','Poi abbiamo bevuto il tè in un piccolo caffè.','Ero stanco, ma ero felice.','La sera abbiamo cucinato la cena insieme.'],
['La settimana scorsa Sara ha perso il telefono sull\'autobus.','Era molto preoccupata perché tutte le sue foto erano lì.','È andata alla stazione degli autobus e ha chiesto all\'autista, ma lui non l\'aveva visto.','Il giorno dopo una donna ha chiamato il suo numero.','Aveva trovato il telefono sotto un sedile.','Sara l\'ha ringraziata e le ha offerto un caffè.','Da allora controlla sempre la borsa prima di scendere dall\'autobus.']],
pt:[['Olá! Qual é o seu nome?','Oi! Meu nome é Sara. E o seu?','Eu sou o Ali. Prazer em conhecê-la.','Prazer também. De onde você é?','Sou de Tabriz, no Irã.','Ah, legal! Eu sou de Berlim.'],
['Bom dia! O que vai querer?','Um café e um pedaço de bolo, por favor.','Mais alguma coisa?','Sim, um copo de água, por favor.','Aqui está. São seis euros.','Obrigado. Aqui está o dinheiro.'],
['Com licença, onde fica a estação de trem?','Siga em frente e vire à esquerda no banco.','É longe?','Não, são uns dez minutos a pé.','Muito obrigado!','De nada. Tenha um bom dia!'],
['Oi, Sara, você está livre no sábado?','Eu queria visitar meus pais. Por quê?','Um amigo vai dar uma festa e eu gostaria que você viesse.','Parece legal. A que horas começa?','Às sete da noite, na casa dele, perto do parque.','Posso visitar meus pais de manhã e depois ir à festa.','Perfeito! Eu passo para te buscar às seis e meia.','Ótimo, até sábado!'],
['Meu nome é Ali.','Moro em Tabriz com a minha família.','Tenho um pai, uma mãe e uma irmã.','Minha irmã é estudante.','Jantamos juntos todas as noites.'],
['Eu acordo às sete horas.','Tomo chá e como pão com queijo.','Depois vou para o trabalho de ônibus.','Começo a trabalhar às nove.','Gosto do meu trabalho.'],
['Ontem fui ao mercado com minha mãe.','Compramos maçãs, pão e queijo.','As maçãs estavam muito baratas.','Depois tomamos chá em um café pequeno.','Eu estava cansado, mas estava feliz.','À noite cozinhamos o jantar juntos.'],
['Na semana passada, Sara perdeu o celular no ônibus.','Ela ficou muito preocupada porque todas as fotos dela estavam nele.','Foi ao ponto de ônibus e perguntou ao motorista, mas ele não tinha visto.','No dia seguinte, uma mulher ligou para o número dela.','Ela tinha encontrado o celular embaixo de um assento.','Sara agradeceu e pagou um café para ela.','Desde então, ela sempre confere a bolsa antes de descer do ônibus.']],
ru:[['Здравствуй! Как тебя зовут?','Привет! Меня зовут Сара. А тебя?','Я Али. Приятно познакомиться.','Мне тоже приятно. Ты откуда?','Я из Тебриза, из Ирана.','О, здорово! А я из Берлина.'],
['Доброе утро! Что вы хотите?','Кофе и кусок торта, пожалуйста.','Что-нибудь ещё?','Да, стакан воды, пожалуйста.','Пожалуйста. С вас шесть евро.','Спасибо. Вот деньги.'],
['Извините, где находится вокзал?','Идите прямо и поверните налево у банка.','Это далеко?','Нет, пешком примерно десять минут.','Большое спасибо!','Пожалуйста. Хорошего дня!'],
['Привет, Сара! Ты свободна в субботу?','Я хотела навестить родителей. А что?','Один друг устраивает вечеринку, и я хотел бы, чтобы ты пришла.','Звучит хорошо. Во сколько она начинается?','В семь часов вечера, у него дома возле парка.','Утром я могу навестить родителей, а потом прийти на вечеринку.','Отлично! Я заеду за тобой в половине седьмого.','Супер, до субботы!'],
['Меня зовут Али.','Я живу в Тебризе с семьёй.','У меня есть отец, мать и сестра.','Моя сестра — студентка.','Мы каждый вечер ужинаем вместе.'],
['Я встаю в семь часов.','Я пью чай и ем хлеб с сыром.','Потом я еду на работу на автобусе.','В девять часов я начинаю работать.','Мне нравится моя работа.'],
['Вчера я ходил на рынок с мамой.','Мы купили яблоки, хлеб и сыр.','Яблоки были очень дешёвые.','Потом мы пили чай в маленьком кафе.','Я устал, но был счастлив.','Вечером мы вместе приготовили ужин.'],
['На прошлой неделе Сара потеряла телефон в автобусе.','Она очень переживала, потому что там были все её фотографии.','Она пошла на автобусную станцию и спросила водителя, но он его не видел.','На следующий день ей на номер позвонила женщина.','Она нашла телефон под сиденьем.','Сара поблагодарила её и угостила кофе.','С тех пор она всегда проверяет сумку, прежде чем выйти из автобуса.']],
tr:[['Merhaba! Adın ne?','Merhaba! Benim adım Sara. Ya senin?','Ben Ali. Tanıştığımıza memnun oldum.','Ben de memnun oldum. Nerelisin?','Ben İran\'ın Tebriz şehrindenim.','Ah, güzel! Ben Berlinliyim.'],
['Günaydın! Ne arzu edersiniz?','Bir kahve ve bir dilim pasta, lütfen.','Başka bir şey?','Evet, bir bardak su, lütfen.','Buyurun. Altı euro tutuyor.','Teşekkürler. Para burada.'],
['Affedersiniz, tren istasyonu nerede?','Düz gidin ve bankanın yanından sola dönün.','Uzak mı?','Hayır, yürüyerek yaklaşık on dakika.','Çok teşekkür ederim!','Rica ederim. İyi günler!'],
['Merhaba Sara, cumartesi boş musun?','Anne babamı ziyaret etmek istiyordum. Neden?','Bir arkadaşım parti veriyor ve gelmeni istiyorum.','Güzel görünüyor. Saat kaçta başlıyor?','Akşam yedide, onun evinde, parkın yanında.','Sabah anne babamı ziyaret edip sonra partiye gelebilirim.','Harika! Seni altı buçukta almaya geleceğim.','Süper, cumartesi görüşürüz!'],
['Benim adım Ali.','Ailemle birlikte Tebriz\'de yaşıyorum.','Bir babam, bir annem ve bir kız kardeşim var.','Kız kardeşim öğrenci.','Her akşam birlikte akşam yemeği yeriz.'],
['Saat yedide kalkarım.','Çay içerim ve peynirle ekmek yerim.','Sonra otobüsle işe giderim.','Dokuzda çalışmaya başlarım.','İşimi seviyorum.'],
['Dün annemle pazara gittim.','Elma, ekmek ve peynir aldık.','Elmalar çok ucuzdu.','Sonra küçük bir kafede çay içtik.','Yorgundum ama mutluydum.','Akşam birlikte akşam yemeği pişirdik.'],
['Geçen hafta Sara telefonunu otobüste kaybetti.','Çok endişeliydi çünkü bütün fotoğrafları içindeydi.','Otobüs durağına gitti ve şoföre sordu ama o görmemişti.','Ertesi gün bir kadın onun numarasını aradı.','Telefonu bir koltuğun altında bulmuştu.','Sara ona teşekkür etti ve ona bir kahve ısmarladı.','O günden beri otobüsten inmeden önce hep çantasını kontrol ediyor.']]
});

ar:[['مرحباً! ما اسمك؟','أهلاً! اسمي سارة. وأنت؟','أنا علي. تشرفت بمعرفتك.','وأنا أيضاً. من أين أنت؟','أنا من تبريز في إيران.','آه، جميل! أنا من برلين.'],
['صباح الخير! ماذا تريد؟','قهوة وقطعة كعك، من فضلك.','هل تريد شيئاً آخر؟','نعم، كوب ماء من فضلك.','تفضل. الحساب ستة يورو.','شكراً. تفضل المال.'],
['عفواً، أين محطة القطار؟','اذهب إلى الأمام ثم انعطف يساراً عند البنك.','هل هي بعيدة؟','لا، تبعد حوالي عشر دقائق سيراً على الأقدام.','شكراً جزيلاً!','عفواً. أتمنى لك يوماً سعيداً!'],
['مرحباً سارة، هل أنتِ متفرغة يوم السبت؟','كنت أريد زيارة والديّ. لماذا؟','صديق لي يقيم حفلة وأريدك أن تأتي.','يبدو جميلاً. متى تبدأ؟','في السابعة مساءً في بيته قرب الحديقة.','أستطيع زيارة والديّ في الصباح ثم آتي إلى الحفلة.','ممتاز! سآتي لآخذك في السادسة والنصف.','رائع، نلتقي يوم السبت!'],
['اسمي علي.','أعيش في تبريز مع عائلتي.','لدي أب وأم وأخت.','أختي طالبة.','نتناول العشاء معاً كل مساء.'],
['أستيقظ في الساعة السابعة.','أشرب الشاي وآكل الخبز مع الجبن.','ثم أذهب إلى العمل بالحافلة.','أبدأ العمل في الساعة التاسعة.','أحب عملي.'],
['أمس ذهبت إلى السوق مع أمي.','اشترينا تفاحاً وخبزاً وجبناً.','كان التفاح رخيصاً جداً.','ثم شربنا الشاي في مقهى صغير.','كنت متعباً لكنني كنت سعيداً.','في المساء طبخنا العشاء معاً.'],
['في الأسبوع الماضي أضاعت سارة هاتفها في الحافلة.','كانت قلقة جداً لأن كل صورها كانت عليه.','ذهبت إلى محطة الحافلات وسألت السائق لكنه لم يره.','في اليوم التالي اتصلت امرأة برقمها.','كانت قد وجدت الهاتف تحت مقعد.','شكرتها سارة واشترت لها قهوة.','ومنذ ذلك الحين تتفقد حقيبتها دائماً قبل أن تنزل من الحافلة.']],
az:[['Salam! Adın nədir?','Salam! Mənim adım Saradır. Bəs sənin?','Mən Əliyəm. Tanış olduğumuza şadam.','Mən də şadam. Haralısan?','Mən İranın Təbriz şəhərindənəm.','Ah, əla! Mən Berlindənəm.'],
['Sabahınız xeyir! Nə istərdiniz?','Bir qəhvə və bir dilim tort, zəhmət olmasa.','Daha nəsə?','Bəli, bir stəkan su, zəhmət olmasa.','Buyurun. Altı avro edir.','Təşəkkür edirəm. Pul budur.'],
['Bağışlayın, qatar stansiyası haradadır?','Düz gedin və bankın yanından sola dönün.','Uzaqdır?','Xeyr, piyada təxminən on dəqiqədir.','Çox sağ olun!','Buyurun. Gününüz xeyir!'],
['Salam Sara, şənbə günü boşsan?','Valideynlərimin yanına getmək istəyirdim. Niyə?','Bir dostum ziyafət verir və istəyirəm ki, sən də gələsən.','Yaxşı səslənir. Saat neçədə başlayır?','Axşam yeddidə, onun evində, parkın yanında.','Səhər valideynlərimin yanına gedib sonra ziyafətə gələ bilərəm.','Əla! Səni altı yarımda götürməyə gələcəyəm.','Super, şənbə görüşərik!'],
['Mənim adım Əlidir.','Mən ailəmlə Təbrizdə yaşayıram.','Mənim atam, anam və bir bacım var.','Bacım tələbədir.','Biz hər axşam birlikdə şam yeyirik.'],
['Mən saat yeddidə qalxıram.','Mən çay içirəm və pendirlə çörək yeyirəm.','Sonra avtobusla işə gedirəm.','Saat doqquzda işə başlayıram.','Mən işimi sevirəm.'],
['Dünən anamla bazara getdim.','Biz alma, çörək və pendir aldıq.','Almalar çox ucuz idi.','Sonra kiçik bir kafedə çay içdik.','Yorğun idim, amma xoşbəxt idim.','Axşam birlikdə şam bişirdik.'],
['Keçən həftə Sara telefonunu avtobusda itirdi.','O, çox narahat idi, çünki bütün şəkilləri telefonda idi.','O, avtobus dayanacağına getdi və sürücüdən soruşdu, amma o, telefonu görməmişdi.','Ertəsi gün bir qadın onun nömrəsinə zəng etdi.','O, telefonu oturacağın altında tapmışdı.','Sara ona təşəkkür etdi və ona qəhvə aldı.','O vaxtdan bəri avtobusdan düşməzdən əvvəl həmişə çantasını yoxlayır.']],
hi:[['नमस्ते! आपका नाम क्या है?','नमस्ते! मेरा नाम सारा है। और आपका?','मैं अली हूँ। आपसे मिलकर खुशी हुई।','मुझे भी खुशी हुई। आप कहाँ से हैं?','मैं ईरान के तबरेज़ से हूँ।','अरे वाह! मैं बर्लिन से हूँ।'],
['सुप्रभात! आप क्या लेंगे?','एक कॉफ़ी और केक का एक टुकड़ा, कृपया।','और कुछ?','हाँ, एक गिलास पानी, कृपया।','ये लीजिए। छह यूरो हुए।','धन्यवाद। ये पैसे लीजिए।'],
['माफ़ कीजिए, रेलवे स्टेशन कहाँ है?','सीधे जाइए और बैंक के पास बाएँ मुड़िए।','क्या वह दूर है?','नहीं, पैदल लगभग दस मिनट है।','बहुत धन्यवाद!','कोई बात नहीं। आपका दिन शुभ हो!'],
['नमस्ते सारा, क्या तुम शनिवार को खाली हो?','मैं अपने माता-पिता से मिलने जाना चाहती थी। क्यों?','एक दोस्त पार्टी दे रहा है और मैं चाहता हूँ कि तुम आओ।','अच्छा लगता है। वह कितने बजे शुरू होती है?','शाम सात बजे, पार्क के पास उसके घर पर।','मैं सुबह माता-पिता से मिल सकती हूँ और फिर पार्टी में आ सकती हूँ।','बहुत बढ़िया! मैं साढ़े छह बजे तुम्हें लेने आऊँगा।','शानदार, शनिवार को मिलते हैं!'],
['मेरा नाम अली है।','मैं अपने परिवार के साथ तबरेज़ में रहता हूँ।','मेरे पिता, माँ और एक बहन हैं।','मेरी बहन छात्रा है।','हम हर शाम साथ में खाना खाते हैं।'],
['मैं सात बजे उठता हूँ।','मैं चाय पीता हूँ और पनीर के साथ रोटी खाता हूँ।','फिर मैं बस से काम पर जाता हूँ।','मैं नौ बजे काम शुरू करता हूँ।','मुझे अपना काम पसंद है।'],
