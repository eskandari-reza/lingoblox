{id:'move',k:'s',l:'B1',t:['A new city','شهری تازه'],g:[['Two years ago I moved to a new city for my job.','دو سال پیش برای کارم به شهری تازه رفتم.'],['At first, I felt lonely because I did not know anyone.','اول احساس تنهایی می‌کردم چون هیچ‌کس را نمی‌شناختم.'],['Then I joined a sports club and made new friends.','بعد به یک باشگاه ورزشی پیوستم و دوستان تازه پیدا کردم.'],['Slowly the city became my home.','کم‌کم شهر خانه‌ام شد.'],['Today I cannot imagine living anywhere else.','امروز نمی‌توانم تصور کنم جای دیگری زندگی کنم.']]},
{id:'lost',k:'s',l:'B1',t:['The lost phone','گوشیِ گم‌شده'],g:[['On Monday I lost my phone on the train.','دوشنبه گوشی‌ام را در قطار گم کردم.'],['I was very nervous because all my photos were on it.','خیلی نگران بودم چون همه‌ی عکس‌هایم روی آن بود.'],['In the evening a stranger called me from my own number.','عصر یک غریبه از شماره‌ی خودم به من زنگ زد.'],['He had found the phone and brought it to the station.','او گوشی را پیدا کرده و به ایستگاه برده بود.'],['I was so grateful that I invited him for dinner.','آن‌قدر سپاسگزار بودم که او را به شام دعوت کردم.']]},
{id:'dream',k:'s',l:'B1',t:['My plan for the future','برنامه‌ام برای آینده'],g:[['In five years I would like to have my own small business.','پنج سال دیگر می‌خواهم کسب‌وکار کوچک خودم را داشته باشم.'],['First I have to save money and learn more about marketing.','اول باید پول پس‌انداز کنم و درباره‌ی بازاریابی بیشتر یاد بگیرم.'],['It will not be easy, but I am ready to work hard.','آسان نخواهد بود، ولی آماده‌ام سخت کار کنم.'],['My family supports me, which makes me strong.','خانواده‌ام از من حمایت می‌کند و این به من قدرت می‌دهد.'],['I believe that dreams come true if you do not give up.','باور دارم اگر تسلیم نشوی رویاها محقق می‌شوند.']]}
);
const A=(l,a)=>{RMS.tx[l]=(RMS.tx[l]||[]).concat(a)};RMS.addTx=A;
A('de',[
['Guten Morgen! Kann ich Ihnen helfen?','Ja, ich möchte zwei Brötchen und ein Brot.','Sonst noch etwas?','Nein, danke. Wie viel kostet das?','Das macht drei Euro fünfzig.','Bitte schön. Einen schönen Tag noch!'],
['Hast du eine große Familie?','Ja, ich habe zwei Brüder und eine Schwester.','Wie alt ist deine Schwester?','Sie ist zwölf Jahre alt.','Und was machen deine Eltern beruflich?','Mein Vater ist Lehrer und meine Mutter ist Krankenschwester.'],
['Entschuldigung, wie spät ist es?','Es ist halb fünf.','Danke. Wann schließt das Geschäft?','Es schließt um sechs Uhr.','Dann habe ich noch Zeit.','Ja, aber beeil dich!'],
['Guten Tag. Was fehlt Ihnen?','Ich habe seit gestern Kopfschmerzen und Halsschmerzen.','Haben Sie Fieber?','Ja, ein bisschen. Achtunddreißig Grad.','Nehmen Sie diese Tabletten zweimal täglich und trinken Sie viel Tee.','Danke, Herr Doktor. Soll ich nächste Woche wiederkommen?'],
['Guten Abend. Haben Sie eine Reservierung?','Ja, ein Einzelzimmer für zwei Nächte auf den Namen Rahimi.','Perfekt. Ihr Zimmer ist im dritten Stock.','Ist das Frühstück inbegriffen?','Ja, es gibt es von sieben bis zehn Uhr.','Prima, danke. Wo ist der Aufzug?'],
['Was machst du am Wochenende?','Ich möchte in den Bergen wandern, wenn das Wetter gut ist.','Das klingt schön. Darf ich mitkommen?','Natürlich! Wir können am Samstag früh losfahren.','Gut. Ich bringe Sandwiches und Wasser mit.','Perfekt. Dann kümmere ich mich um die Karte.'],
['Erzählen Sie mir bitte etwas über sich.','Ich habe Informatik studiert und arbeite seit vier Jahren als Entwickler.','Warum möchten Sie die Stelle wechseln?','Ich suche neue Herausforderungen und möchte mehr lernen.','Was sind Ihre Stärken?','Ich arbeite gut im Team und erledige meine Aufgaben immer pünktlich.'],
['Hallo, ich habe diese Jacke letzte Woche gekauft, aber sie ist zu klein.','Haben Sie den Kassenbon dabei?','Ja, hier bitte.','Es tut mir leid, aber diese Jacke haben wir nicht in einer größeren Größe.','Dann möchte ich mein Geld zurück.','Kein Problem. Ich erstatte es Ihnen sofort auf Ihre Karte.'],
['Ich stehe um sieben Uhr auf.','Ich frühstücke mit meiner Familie.','Dann fahre ich mit dem Bus zur Arbeit.','Am Abend koche ich das Abendessen und sehe einen Film.','Um elf Uhr gehe ich ins Bett.'],
['Meine beste Freundin heißt Lena.','Sie ist zwanzig Jahre alt und wohnt in meiner Nähe.','Sie mag Musik und spielt Gitarre.','Sonntags gehen wir oft im Park spazieren.','Ich bin froh, so eine gute Freundin zu haben.'],
['Letzten Sommer sind wir ans Meer gefahren.','Die Sonne schien und das Wasser war warm.','Die Kinder haben am Strand eine große Sandburg gebaut.','Am Nachmittag haben wir in einem kleinen Restaurant frischen Fisch gegessen.','Am Abend waren wir müde, aber sehr glücklich.'],
['Jeden Samstag gehe ich auf den Markt in der Nähe meines Hauses.','Dort kaufe ich frisches Gemüse, Obst und Käse.','Die Verkäufer sind freundlich und schenken mir oft eine Kleinigkeit.','Danach treffe ich meinen Nachbarn auf einen Kaffee.','Mittags trage ich die schweren Taschen nach Hause.'],
['Heute regnet es schon seit dem Morgen.','Ich konnte nicht spazieren gehen und bin zu Hause geblieben.','Ich habe heißen Tee gemacht und ein Buch gelesen.','Meine Katze hat neben mir auf dem Sofa geschlafen.','Regentage können sehr gemütlich sein.'],
['Vor zwei Jahren bin ich wegen meines Jobs in eine neue Stadt gezogen.','Am Anfang fühlte ich mich einsam, weil ich niemanden kannte.','Dann bin ich einem Sportverein beigetreten und habe neue Freunde gefunden.','Langsam wurde die Stadt zu meinem Zuhause.','Heute kann ich mir nicht vorstellen, woanders zu leben.'],
['Am Montag habe ich mein Handy im Zug verloren.','Ich war sehr nervös, weil alle meine Fotos darauf waren.','Am Abend rief mich ein Fremder von meiner eigenen Nummer aus an.','Er hatte das Handy gefunden und zum Bahnhof gebracht.','Ich war so dankbar, dass ich ihn zum Abendessen eingeladen habe.'],
['In fünf Jahren möchte ich ein eigenes kleines Unternehmen haben.','Zuerst muss ich Geld sparen und mehr über Marketing lernen.','Es wird nicht leicht sein, aber ich bin bereit, hart zu arbeiten.','Meine Familie unterstützt mich, das macht mich stark.','Ich glaube, dass Träume wahr werden, wenn man nicht aufgibt.']]);
A('es',[
['¡Buenos días! ¿En qué puedo ayudarle?','Sí, quiero dos panecillos y una barra de pan.','¿Algo más?','No, gracias. ¿Cuánto es?','Son tres euros con cincuenta.','Aquí tiene. ¡Que tenga un buen día!'],
['¿Tienes una familia grande?','Sí, tengo dos hermanos y una hermana.','¿Cuántos años tiene tu hermana?','Tiene doce años.','¿Y a qué se dedican tus padres?','Mi padre es profesor y mi madre es enfermera.'],
['Disculpe, ¿qué hora es?','Son las cuatro y media.','Gracias. ¿A qué hora cierra la tienda?','Cierra a las seis.','Entonces todavía tengo tiempo.','Sí, ¡pero date prisa!'],
['Buenas tardes. ¿Qué le pasa?','Desde ayer tengo dolor de cabeza y de garganta.','¿Tiene fiebre?','Sí, un poco. Treinta y ocho grados.','Tome esta medicina dos veces al día y beba mucho té.','Gracias, doctor. ¿Vuelvo la semana que viene?'],
['Buenas noches. ¿Tiene una reserva?','Sí, una habitación individual para dos noches a nombre de Rahimi.','Perfecto. Su habitación está en el tercer piso.','¿El desayuno está incluido?','Sí, se sirve de siete a diez.','Genial, gracias. ¿Dónde está el ascensor?'],
['¿Qué haces este fin de semana?','Quiero hacer senderismo en la montaña si hace buen tiempo.','Suena genial. ¿Puedo ir contigo?','¡Claro! Podemos salir temprano el sábado por la mañana.','Bien. Yo llevaré bocadillos y agua.','Perfecto. Entonces yo me encargo del mapa.'],
['Cuénteme un poco sobre usted, por favor.','Estudié informática y llevo cuatro años trabajando como desarrollador.','¿Por qué quiere cambiar de trabajo?','Busco nuevos retos y la oportunidad de aprender más.','¿Cuáles son sus puntos fuertes?','Trabajo bien en equipo y siempre termino mis tareas a tiempo.'],
['Hola, compré esta chaqueta la semana pasada, pero me queda pequeña.','¿Tiene el ticket de compra?','Sí, aquí está.','Lo siento, pero no tenemos esta chaqueta en una talla mayor.','Entonces quiero que me devuelvan el dinero.','No hay problema. Se lo devuelvo ahora mismo a su tarjeta.'],
['Me levanto a las siete.','Desayuno con mi familia.','Luego voy al trabajo en autobús.','Por la noche preparo la cena y veo una película.','A las once me acuesto.'],
['Mi mejor amiga se llama Lena.','Tiene veinte años y vive cerca de mí.','Le gusta la música y toca la guitarra.','Los domingos solemos pasear por el parque.','Estoy contento de tener una amiga tan buena.'],
['El verano pasado fuimos en coche al mar.','Hacía sol y el agua estaba caliente.','Los niños construyeron un gran castillo de arena en la playa.','Por la tarde comimos pescado fresco en un pequeño restaurante.','Por la noche estábamos cansados pero muy felices.'],
['Todos los sábados voy al mercado cerca de mi casa.','Allí compro verduras, fruta y queso frescos.','Los vendedores son simpáticos y a menudo me regalan algo pequeño.','Luego quedo con mi vecino para tomar un café.','Al mediodía llevo las bolsas pesadas a casa.'],
['Hoy llueve desde por la mañana.','No pude salir a pasear, así que me quedé en casa.','Preparé té caliente y leí un libro.','Mi gato durmió a mi lado en el sofá.','Los días de lluvia pueden ser muy acogedores.'],
['Hace dos años me mudé a una ciudad nueva por mi trabajo.','Al principio me sentía solo porque no conocía a nadie.','Luego me apunté a un club deportivo y hice nuevos amigos.','Poco a poco la ciudad se convirtió en mi hogar.','Hoy no me imagino viviendo en otro lugar.'],
['El lunes perdí el móvil en el tren.','Estaba muy nervioso porque tenía todas mis fotos.','Por la tarde me llamó un desconocido desde mi propio número.','Había encontrado el móvil y lo había llevado a la estación.','Estaba tan agradecido que lo invité a cenar.'],
['Dentro de cinco años me gustaría tener mi propio negocio.','Primero tengo que ahorrar dinero y aprender más sobre marketing.','No será fácil, pero estoy dispuesto a trabajar duro.','Mi familia me apoya, y eso me hace fuerte.','Creo que los sueños se cumplen si no te rindes.']]);
A('fr',[
['Bonjour ! Puis-je vous aider ?','Oui, je voudrais deux petits pains et une baguette.','Avec ceci ?','Non, merci. Combien je vous dois ?','Ça fait trois euros cinquante.','Voilà. Bonne journée !'],
['Tu as une grande famille ?','Oui, j’ai deux frères et une sœur.','Quel âge a ta sœur ?','Elle a douze ans.','Et que font tes parents ?','Mon père est professeur et ma mère est infirmière.'],
['Excusez-moi, quelle heure est-il ?','Il est quatre heures et demie.','Merci. À quelle heure ferme le magasin ?','Il ferme à six heures.','Alors j’ai encore le temps.','Oui, mais dépêche-toi !'],
['Bonjour. Qu’est-ce qui ne va pas ?','J’ai mal à la tête et à la gorge depuis hier.','Avez-vous de la fièvre ?','Oui, un peu. Trente-huit degrés.','Prenez ce médicament deux fois par jour et buvez beaucoup de thé.','Merci, docteur. Dois-je revenir la semaine prochaine ?'],
['Bonsoir. Avez-vous une réservation ?','Oui, une chambre simple pour deux nuits au nom de Rahimi.','Parfait. Votre chambre est au troisième étage.','Le petit-déjeuner est-il compris ?','Oui, il est servi de sept heures à dix heures.','Super, merci. Où est l’ascenseur ?'],
['Que fais-tu ce week-end ?','Je veux faire de la randonnée en montagne s’il fait beau.','Ça a l’air bien. Je peux venir avec toi ?','Bien sûr ! On peut partir tôt samedi matin.','D’accord. J’apporterai des sandwichs et de l’eau.','Parfait. Alors je m’occupe de la carte.'],
['Parlez-moi un peu de vous, s’il vous plaît.','J’ai fait des études d’informatique et je travaille comme développeur depuis quatre ans.','Pourquoi voulez-vous changer de travail ?','Je cherche de nouveaux défis et la possibilité d’apprendre davantage.','Quels sont vos points forts ?','Je travaille bien en équipe et je termine toujours mes tâches à temps.'],
['Bonjour, j’ai acheté cette veste la semaine dernière, mais elle est trop petite.','Avez-vous le ticket de caisse ?','Oui, le voici.','Je suis désolé, mais nous n’avons pas cette veste dans une taille plus grande.','Alors je voudrais être remboursé.','Pas de problème. Je vous rembourse tout de suite sur votre carte.'],
['Je me lève à sept heures.','Je prends le petit-déjeuner avec ma famille.','Ensuite, je vais au travail en bus.','Le soir, je prépare le dîner et je regarde un film.','À onze heures, je me couche.'],
['Ma meilleure amie s’appelle Léna.','Elle a vingt ans et habite près de chez moi.','Elle aime la musique et joue de la guitare.','Le dimanche, nous nous promenons souvent dans le parc.','Je suis heureux d’avoir une si bonne amie.'],
['L’été dernier, nous sommes allés à la mer en voiture.','Le soleil brillait et l’eau était chaude.','Les enfants ont construit un grand château de sable sur la plage.','L’après-midi, nous avons mangé du poisson frais dans un petit restaurant.','Le soir, nous étions fatigués mais très heureux.'],
['Chaque samedi, je vais au marché près de chez moi.','J’y achète des légumes, des fruits et du fromage frais.','Les vendeurs sont sympathiques et m’offrent souvent un petit cadeau.','Ensuite, je retrouve mon voisin pour prendre un café.','À midi, je rapporte les sacs lourds à la maison.'],
['Aujourd’hui, il pleut depuis ce matin.','Je n’ai pas pu me promener, alors je suis resté à la maison.','J’ai préparé du thé chaud et j’ai lu un livre.','Mon chat a dormi à côté de moi sur le canapé.','Les jours de pluie peuvent être très agréables.'],
['Il y a deux ans, j’ai déménagé dans une nouvelle ville pour mon travail.','Au début, je me sentais seul parce que je ne connaissais personne.','Ensuite, je me suis inscrit dans un club de sport et je me suis fait de nouveaux amis.','Peu à peu, la ville est devenue chez moi.','Aujourd’hui, je ne peux pas imaginer vivre ailleurs.'],
['Lundi, j’ai perdu mon téléphone dans le train.','J’étais très nerveux parce que toutes mes photos étaient dessus.','Le soir, un inconnu m’a appelé depuis mon propre numéro.','Il avait trouvé le téléphone et l’avait apporté à la gare.','J’étais si reconnaissant que je l’ai invité à dîner.'],
['Dans cinq ans, j’aimerais avoir ma propre petite entreprise.','D’abord, je dois économiser de l’argent et en apprendre plus sur le marketing.','Ce ne sera pas facile, mais je suis prêt à travailler dur.','Ma famille me soutient, et cela me rend fort.','Je crois que les rêves se réalisent si on ne renonce pas.']]);
A('it',[
['Buongiorno! Posso aiutarla?','Sì, vorrei due panini e una pagnotta.','Altro?','No, grazie. Quanto costa?','Fanno tre euro e cinquanta.','Ecco a lei. Buona giornata!'],
['Hai una famiglia numerosa?','Sì, ho due fratelli e una sorella.','Quanti anni ha tua sorella?','Ha dodici anni.','E che lavoro fanno i tuoi genitori?','Mio padre è insegnante e mia madre è infermiera.'],
['Scusi, che ore sono?','Sono le quattro e mezza.','Grazie. A che ora chiude il negozio?','Chiude alle sei.','Allora ho ancora tempo.','Sì, ma sbrigati!'],
['Buon pomeriggio. Cosa c’è che non va?','Da ieri ho mal di testa e mal di gola.','Ha la febbre?','Sì, un po’. Trentotto gradi.','Prenda questa medicina due volte al giorno e beva molto tè.','Grazie, dottore. Devo tornare la settimana prossima?'],
['Buonasera. Ha una prenotazione?','Sì, una camera singola per due notti a nome Rahimi.','Perfetto. La sua camera è al terzo piano.','La colazione è inclusa?','Sì, viene servita dalle sette alle dieci.','Ottimo, grazie. Dov’è l’ascensore?'],
['Che fai questo fine settimana?','Se il tempo è bello, voglio fare un’escursione in montagna.','Bellissimo. Posso venire con te?','Certo! Possiamo partire presto sabato mattina.','Bene. Io porto panini e acqua.','Perfetto. Allora io mi occupo della mappa.'],
['Mi parli un po’ di lei, per favore.','Ho studiato informatica e lavoro come sviluppatore da quattro anni.','Perché vuole cambiare lavoro?','Cerco nuove sfide e l’opportunità di imparare di più.','Quali sono i suoi punti di forza?','Lavoro bene in squadra e finisco sempre i compiti in tempo.'],
['Salve, ho comprato questa giacca la settimana scorsa, ma è troppo piccola.','Ha lo scontrino con sé?','Sì, eccolo.','Mi dispiace, ma non abbiamo questa giacca in una taglia più grande.','Allora vorrei riavere i miei soldi.','Nessun problema. Glieli rimborso subito sulla carta.'],
['Mi alzo alle sette.','Faccio colazione con la mia famiglia.','Poi vado al lavoro in autobus.','La sera preparo la cena e guardo un film.','Alle undici vado a letto.'],
['La mia migliore amica si chiama Lena.','Ha vent’anni e abita vicino a me.','Le piace la musica e suona la chitarra.','La domenica passeggiamo spesso nel parco.','Sono felice di avere un’amica così.'],
['L’estate scorsa siamo andati al mare in macchina.','Il sole splendeva e l’acqua era calda.','I bambini hanno costruito un grande castello di sabbia sulla spiaggia.','Nel pomeriggio abbiamo mangiato pesce fresco in un piccolo ristorante.','La sera eravamo stanchi ma molto felici.'],
['Ogni sabato vado al mercato vicino a casa mia.','Lì compro verdura, frutta e formaggio freschi.','I venditori sono gentili e spesso mi regalano qualcosa.','Poi incontro il mio vicino per un caffè.','A mezzogiorno porto a casa le borse pesanti.'],
['Oggi piove fin dal mattino.','Non sono potuto uscire a passeggiare, così sono rimasto a casa.','Ho preparato un tè caldo e letto un libro.','Il mio gatto ha dormito accanto a me sul divano.','I giorni di pioggia possono essere molto accoglienti.'],
['Due anni fa mi sono trasferito in una nuova città per lavoro.','All’inizio mi sentivo solo perché non conoscevo nessuno.','Poi mi sono iscritto a un club sportivo e ho conosciuto nuovi amici.','A poco a poco la città è diventata casa mia.','Oggi non riesco a immaginare di vivere altrove.'],
['Lunedì ho perso il telefono sul treno.','Ero molto agitato perché c’erano tutte le mie foto.','La sera uno sconosciuto mi ha chiamato dal mio stesso numero.','Aveva trovato il telefono e l’aveva portato in stazione.','Ero così grato che l’ho invitato a cena.'],
['Tra cinque anni vorrei avere una piccola attività tutta mia.','Prima devo risparmiare e imparare di più sul marketing.','Non sarà facile, ma sono pronto a lavorare sodo.','La mia famiglia mi sostiene e questo mi rende forte.','Credo che i sogni si realizzino se non ci si arrende.']]);

['Você tem uma família grande?','Sim, tenho dois irmãos e uma irmã.','Quantos anos tem a sua irmã?','Ela tem doze anos.','E o que os seus pais fazem?','Meu pai é professor e minha mãe é enfermeira.'],

['Todo sábado vou à feira perto da minha casa.','Lá compro legumes, frutas e queijo frescos.','Os vendedores são simpáticos e muitas vezes me dão um mimo.','Depois encontro o meu vizinho para um café.','Ao meio-dia levo as sacolas pesadas para casa.'],
['Hoje chove desde de manhã.','Não pude passear, por isso fiquei em casa.','Fiz chá quente e li um livro.','Meu gato dormiu ao meu lado no sofá.','Dias de chuva podem ser muito aconchegantes.'],

['Bazar ertəsi telefonumu qatarda itirdim.','Çox həyəcanlı idim, çünki bütün şəkillərim orada idi.','Axşam bir yad adam öz nömrəmdən mənə zəng etdi.','O, telefonu tapıb vağzala aparmışdı.','O qədər minnətdar idim ki, onu şam yeməyinə dəvət etdim.'],
['Beş ildən sonra öz kiçik biznesimin olmasını istəyirəm.','Əvvəlcə pul yığmalı və marketinq haqqında daha çox öyrənməliyəm.','Asan olmayacaq, amma çox çalışmağa hazıram.','Ailəm məni dəstəkləyir və bu məni güclü edir.','İnanıram ki, təslim olmasan, arzular çin olur.']]);
A('hi',[
['सुप्रभात! मैं आपकी क्या मदद कर सकता हूँ?','जी, मुझे दो छोटी रोटियाँ और एक बड़ा ब्रेड चाहिए।','और कुछ?','नहीं, धन्यवाद। कितने पैसे हुए?','साढ़े तीन यूरो।','ये लीजिए। आपका दिन शुभ हो!'],
['क्या तुम्हारा परिवार बड़ा है?','हाँ, मेरे दो भाई और एक बहन हैं।','तुम्हारी बहन कितने साल की है?','वह बारह साल की है।','और तुम्हारे माता-पिता क्या करते हैं?','मेरे पिता शिक्षक हैं और मेरी माँ नर्स हैं।'],
['माफ़ कीजिए, क्या समय हुआ है?','साढ़े चार बजे हैं।','धन्यवाद। दुकान कब बंद होती है?','वह छह बजे बंद होती है।','तो अभी मेरे पास समय है।','हाँ, पर जल्दी करो!'],
['नमस्ते। क्या परेशानी है?','कल से मुझे सिरदर्द और गले में दर्द है।','क्या आपको बुखार है?','हाँ, थोड़ा। अड़तीस डिग्री।','यह दवा दिन में दो बार लें और खूब चाय पिएँ।','धन्यवाद, डॉक्टर साहब। क्या मैं अगले हफ़्ते फिर आऊँ?'],
['शुभ संध्या। क्या आपकी बुकिंग है?','जी, रहीमी के नाम से दो रात के लिए एक सिंगल कमरा।','बढ़िया। आपका कमरा तीसरी मंज़िल पर है।','क्या नाश्ता शामिल है?','जी हाँ, वह सात से दस बजे तक मिलता है।','बहुत अच्छा, धन्यवाद। लिफ़्ट कहाँ है?'],
['इस सप्ताहांत तुम क्या कर रहे हो?','अगर मौसम अच्छा रहा तो मैं पहाड़ों में ट्रेकिंग करना चाहता हूँ।','अच्छा लगता है। क्या मैं तुम्हारे साथ आ सकता हूँ?','बिल्कुल! हम शनिवार सुबह जल्दी निकल सकते हैं।','ठीक है। मैं सैंडविच और पानी लाऊँगा।','बढ़िया। तब नक्शा मैं सँभाल लूँगा।'],
['कृपया अपने बारे में थोड़ा बताइए।','मैंने कंप्यूटर साइंस पढ़ी है और चार साल से डेवलपर के रूप में काम कर रहा हूँ।','आप नौकरी क्यों बदलना चाहते हैं?','मैं नई चुनौतियाँ और ज़्यादा सीखने का मौका ढूँढ रहा हूँ।','आपकी ताक़तें क्या हैं?','मैं टीम में अच्छा काम करता हूँ और अपने काम हमेशा समय पर पूरे करता हूँ।'],
['नमस्ते, मैंने पिछले हफ़्ते यह जैकेट ख़रीदी थी, पर यह बहुत छोटी है।','क्या आपके पास रसीद है?','जी हाँ, ये रही।','माफ़ कीजिए, पर यह जैकेट हमारे पास बड़े साइज़ में नहीं है।','तो मैं अपने पैसे वापस चाहता हूँ।','कोई बात नहीं। मैं अभी आपके कार्ड में वापस कर देता हूँ।'],
['मैं सात बजे उठता हूँ।','मैं अपने परिवार के साथ नाश्ता करता हूँ।','फिर मैं बस से काम पर जाता हूँ।','शाम को मैं खाना बनाता हूँ और फ़िल्म देखता हूँ।','ग्यारह बजे मैं सो जाता हूँ।'],
['मेरी सबसे अच्छी दोस्त का नाम लीना है।','वह बीस साल की है और मेरे पास रहती है।','उसे संगीत पसंद है और वह गिटार बजाती है।','रविवार को हम अक्सर पार्क में टहलते हैं।','मुझे ख़ुशी है कि मेरी ऐसी अच्छी दोस्त है।'],
['पिछली गर्मियों में हम कार से समुद्र किनारे गए।','धूप खिली थी और पानी गर्म था।','बच्चों ने किनारे पर रेत का बड़ा क़िला बनाया।','दोपहर बाद हमने एक छोटे रेस्तराँ में ताज़ा मछली खाई।','शाम को हम थके थे पर बहुत ख़ुश थे।'],
['हर शनिवार मैं अपने घर के पास के बाज़ार जाता हूँ।','वहाँ मैं ताज़ी सब्ज़ियाँ, फल और पनीर ख़रीदता हूँ।','दुकानदार मिलनसार हैं और अक्सर मुझे छोटा-सा तोहफ़ा देते हैं।','फिर मैं अपने पड़ोसी से कॉफ़ी के लिए मिलता हूँ।','दोपहर में मैं भारी थैले घर ले आता हूँ।'],
['आज सुबह से बारिश हो रही है।','मैं टहलने नहीं जा सका, इसलिए घर पर ही रहा।','मैंने गरम चाय बनाई और किताब पढ़ी।','मेरी बिल्ली सोफ़े पर मेरे पास सो गई।','बारिश के दिन बहुत आरामदायक हो सकते हैं।'],
['दो साल पहले मैं नौकरी के लिए एक नए शहर में आ गया।','शुरू में मैं अकेला महसूस करता था क्योंकि मैं किसी को नहीं जानता था।','फिर मैं एक खेल क्लब से जुड़ा और नए दोस्त बनाए।','धीरे-धीरे यह शहर मेरा घर बन गया।','आज मैं कहीं और रहने की कल्पना भी नहीं कर सकता।'],
['सोमवार को मेरा फ़ोन ट्रेन में खो गया।','मैं बहुत घबरा गया क्योंकि मेरी सारी तस्वीरें उसमें थीं।','शाम को एक अजनबी ने मेरे ही नंबर से मुझे फ़ोन किया।','उसे फ़ोन मिल गया था और वह उसे स्टेशन पर ले आया था।','मैं इतना आभारी था कि मैंने उसे रात के खाने पर बुलाया।'],
['पाँच साल में मैं अपना छोटा-सा कारोबार शुरू करना चाहता हूँ।','पहले मुझे पैसे बचाने होंगे और मार्केटिंग के बारे में और सीखना होगा।','यह आसान नहीं होगा, पर मैं कड़ी मेहनत के लिए तैयार हूँ।','मेरा परिवार मेरा साथ देता है, जो मुझे मज़बूत बनाता है।','मुझे विश्वास है कि हार न मानो तो सपने सच होते हैं।']]);
A('ja',[

['こんにちは。どうされましたか。','昨日から頭とのどが痛いんです。','熱はありますか。','はい、少し。三十八度です。','この薬を一日二回飲んで、お茶をたくさん飲んでください。','ありがとうございます、先生。来週また来たほうがいいですか。'],
['こんばんは。ご予約はありますか。','はい、ラヒミの名前で、シングルルームを二泊お願いします。','かしこまりました。お部屋は三階です。','朝食は含まれていますか。','はい、七時から十時までです。','よかった、ありがとう。エレベーターはどこですか。'],
['今週末は何をするの？','天気が良ければ、山にハイキングに行きたいな。','いいね。一緒に行ってもいい？','もちろん！土曜日の朝早く出発しよう。','いいね。私はサンドイッチと水を持っていくよ。','完璧。じゃあ地図は僕が用意するよ。'],
['まず、簡単に自己紹介をお願いします。','情報工学を学び、四年間開発者として働いています。','なぜ転職を考えているのですか。','新しい挑戦と、もっと学べる機会を求めています。','あなたの強みは何ですか。','チームでの仕事が得意で、いつも期限までに仕事を終わらせます。'],
['すみません、先週このジャケットを買ったのですが、小さすぎるんです。','レシートはお持ちですか。','はい、これです。','申し訳ありませんが、このジャケットの大きいサイズはございません。','それなら返金をお願いしたいです。','承知しました。すぐにカードへ返金いたします。'],
['私は七時に起きます。','家族と朝ごはんを食べます。','それからバスで仕事に行きます。','夜は夕食を作って、映画を見ます。','十一時に寝ます。'],
['私の親友の名前はレナです。','彼女は二十歳で、私の家の近くに住んでいます。','彼女は音楽が好きで、ギターを弾きます。','日曜日にはよく公園を散歩します。','こんなに良い友達がいて、うれしいです。'],
['去年の夏、私たちは車で海へ行きました。','太陽が輝いていて、水は温かかったです。','子どもたちは浜辺で大きな砂のお城を作りました。','午後は小さなレストランで新鮮な魚を食べました。','夜は疲れていましたが、とても幸せでした。'],
['毎週土曜日、私は家の近くの市場に行きます。','そこで新鮮な野菜と果物とチーズを買います。','店の人は親切で、よく小さなおまけをくれます。','それから隣人とコーヒーを飲みます。','昼に重い袋を家に運びます。'],
['今日は朝からずっと雨です。','散歩に行けなかったので、家にいました。','温かいお茶を入れて、本を読みました。','猫がソファの私の隣で眠っていました。','雨の日はとても居心地がいいこともあります。'],
['二年前、仕事のために新しい街に引っ越しました。','最初は誰も知らなくて、寂しく感じました。','それからスポーツクラブに入って、新しい友達ができました。','少しずつ、その街は私の家になりました。','今では、ほかの場所で暮らすことが想像できません。'],
['月曜日、電車の中で携帯電話をなくしました。','写真が全部入っていたので、とても不安でした。','夜、知らない人が私自身の番号から電話をかけてきました。','その人は携帯を見つけて、駅に届けてくれたのです。','とても感謝して、その人を夕食に招待しました。'],
['五年後、自分の小さな店を持ちたいです。','まずお金をためて、マーケティングをもっと勉強しなければなりません。','簡単ではありませんが、一生懸命働く覚悟があります。','家族が支えてくれるので、強くなれます。','あきらめなければ、夢は叶うと信じています。']]);
A('ko',[
['안녕하세요! 무엇을 도와드릴까요?','네, 롤빵 두 개와 식빵 한 덩이 주세요.','더 필요하신 것은요?','아니요, 괜찮습니다. 얼마예요?','삼 유로 오십 센트입니다.','여기 있습니다. 좋은 하루 보내세요!'],
['대가족이에요?','네, 형제가 둘이고 여동생이 한 명 있어요.','여동생은 몇 살이에요?','열두 살이에요.','부모님은 무슨 일을 하세요?','아버지는 교사이시고 어머니는 간호사예요.'],
['실례합니다, 지금 몇 시예요?','네 시 반이에요.','감사합니다. 가게는 언제 문을 닫아요?','여섯 시에 닫아요.','그럼 아직 시간이 있네요.','네, 그래도 서두르세요!'],
['안녕하세요. 어디가 불편하세요?','어제부터 머리와 목이 아파요.','열이 있으세요?','네, 조금요. 삼십팔 도예요.','이 약을 하루에 두 번 드시고 차를 많이 마시세요.','감사합니다, 선생님. 다음 주에 또 와야 하나요?'],
['안녕하세요. 예약하셨어요?','네, 라히미 이름으로 이틀 동안 싱글룸이요.','좋습니다. 방은 삼 층이에요.','아침 식사는 포함되어 있나요?','네, 일곱 시부터 열 시까지입니다.','좋아요, 감사합니다. 엘리베이터는 어디예요?'],
['이번 주말에 뭐 해?','날씨가 좋으면 산으로 하이킹 가고 싶어.','좋겠다. 나도 같이 가도 돼?','물론이지! 토요일 아침 일찍 출발하면 돼.','좋아. 나는 샌드위치랑 물을 가져갈게.','완벽해. 그럼 지도는 내가 챙길게.'],
['간단히 자기소개를 해 주세요.','컴퓨터공학을 전공했고 사 년째 개발자로 일하고 있습니다.','왜 이직하시려고 하나요?','새로운 도전과 더 배울 기회를 찾고 있습니다.','강점이 무엇인가요?','팀에서 일을 잘하고, 맡은 일을 항상 제시간에 끝냅니다.'],
['안녕하세요, 지난주에 이 재킷을 샀는데 너무 작아요.','영수증 가지고 계세요?','네, 여기 있어요.','죄송하지만 이 재킷은 더 큰 사이즈가 없습니다.','그럼 환불해 주세요.','문제없습니다. 바로 카드로 환불해 드리겠습니다.'],
['저는 일곱 시에 일어납니다.','가족과 함께 아침을 먹습니다.','그다음 버스를 타고 출근합니다.','저녁에는 저녁을 만들고 영화를 봅니다.','열한 시에 잠자리에 듭니다.'],
['제 가장 친한 친구의 이름은 레나예요.','그녀는 스무 살이고 저와 가까이 살아요.','음악을 좋아하고 기타를 쳐요.','일요일에는 자주 공원에서 산책해요.','이렇게 좋은 친구가 있어서 기뻐요.'],
['지난여름에 우리는 차를 타고 바다에 갔어요.','해가 빛나고 물이 따뜻했어요.','아이들은 해변에서 큰 모래성을 만들었어요.','오후에는 작은 식당에서 신선한 생선을 먹었어요.','저녁에는 피곤했지만 아주 행복했어요.'],

{id:'debate',k:'d',l:'B2',t:['Working from home','کار از خانه'],g:[['I think working from home is more productive than going to the office.','فکر می‌کنم کار از خانه از رفتن به دفتر مؤثرتر است.'],['I see your point, but I miss the spontaneous conversations with colleagues.','نظرت را می‌فهمم، اما دلم برای گفتگوهای خودجوش با همکاران تنگ می‌شود.'],['Fair enough. However, I save two hours a day by not commuting.','درست است. با این حال، چون رفت‌وآمد ندارم روزی دو ساعت صرفه‌جویی می‌کنم.'],['That is true, although I find it harder to switch off after work.','درست است، هرچند برایم سخت‌تر است که بعد از کار ذهنم را از کار جدا کنم.'],['Perhaps we should agree on a hybrid model: two days at home and three at the office.','شاید باید روی یک مدل ترکیبی توافق کنیم: دو روز در خانه و سه روز در دفتر.'],['That sounds like a reasonable compromise. Let us suggest it to our manager.','این مصالحهٔ معقولی به نظر می‌رسد. بیا آن را به مدیرمان پیشنهاد بدهیم.']]},
{id:'deadline',k:'s',l:'B2',t:['The changed deadline','مهلت تغییرکرده'],g:[['Although Lena had planned the project carefully, the client suddenly changed the requirements.','هرچند لنا پروژه را با دقت برنامه‌ریزی کرده بود، مشتری ناگهان نیازمندی‌ها را عوض کرد.'],['She could have complained, but she decided to talk to her team instead.','می‌توانست شکایت کند، اما تصمیم گرفت به‌جای آن با تیمش صحبت کند.'],['Together they rewrote the schedule and worked late for three evenings.','با هم برنامه را از نو نوشتند و سه شب تا دیروقت کار کردند.'],['By Friday the report was finished, and the client was so impressed that he offered them a new contract.','تا جمعه گزارش تمام شد و مشتری چنان تحت تأثیر قرار گرفت که قرارداد تازه‌ای به آن‌ها پیشنهاد داد.'],['Lena learned that staying calm is often more useful than looking for someone to blame.','لنا یاد گرفت که آرام ماندن اغلب مفیدتر از پیدا کردن مقصر است.']]},
{id:'bridge',k:'s',l:'C1',t:['The old bridge','پل قدیمی'],g:[['The old bridge had stood over the river for two centuries, and few people paid any attention to it.','پل قدیمی دو قرن بر فراز رودخانه ایستاده بود و کمتر کسی به آن توجه می‌کرد.'],['It was only when the council announced its demolition that the villagers realised how much it meant to them.','فقط وقتی شورا تخریب آن را اعلام کرد، روستاییان فهمیدند که چه قدر برایشان ارزش دارد.'],['Had they been consulted earlier, they would have proposed a restoration instead of a costly replacement.','اگر زودتر با آن‌ها مشورت شده بود، به‌جای جایگزینی پرهزینه، مرمت را پیشنهاد می‌کردند.'],['After months of campaigning, the plan was withdrawn, not because the engineers agreed, but because the public refused to give way.','پس از ماه‌ها کارزار، طرح پس گرفته شد؛ نه به این دلیل که مهندسان موافقت کردند، بلکه چون مردم کوتاه نیامدند.'],['Today the bridge remains, a reminder that heritage survives only when people are willing to defend it.','امروز پل هنوز پابرجاست و یادآور این است که میراث فقط وقتی می‌ماند که مردم حاضر به دفاع از آن باشند.']]},
{id:'tongue',k:'s',l:'C2',t:['Arriving in a language','رسیدن به یک زبان'],g:[['Learning a language is less a matter of accumulating words than of gradually unlearning the habits of one’s own.','یادگیری زبان کمتر انباشتن واژه‌هاست و بیشتر فراموش کردن تدریجی عادت‌های زبان خود.'],['Every idiom that resists translation exposes an assumption we had never thought to question.','هر اصطلاحی که در برابر ترجمه مقاومت می‌کند، پیش‌فرضی را آشکار می‌کند که هرگز فکر نکرده بودیم زیر سؤال ببریم.'],['Fluency, therefore, is not the absence of mistakes but the willingness to be misunderstood and to try again.','پس روانی یعنی نبودِ اشتباه نیست، بلکه آمادگی برای سوءتفاهم و تلاش دوباره است.'],['Years later, I still catch myself dreaming in sentences that belong to no single tongue.','سال‌ها بعد هنوز خودم را در حال رؤیا دیدن با جمله‌هایی می‌یابم که به هیچ زبان واحدی تعلق ندارند.'],['Perhaps that, more than any grammar, is what it means to have truly arrived in another language.','شاید این، بیش از هر دستوری، معنای واقعی رسیدن به زبانی دیگر باشد.']]}

A('ru',[
['Я думаю, что работать из дома продуктивнее, чем ходить в офис.','Я понимаю тебя, но мне не хватает спонтанных разговоров с коллегами.','Справедливо. Зато я экономлю два часа в день на дороге.','Это правда, хотя мне труднее отключаться после работы.','Может быть, нам стоит договориться о гибридной модели: два дня дома и три в офисе.','Звучит как разумный компромисс. Давай предложим это нашему руководителю.'],
['Хотя Лена тщательно спланировала проект, клиент вдруг изменил требования.','Она могла бы пожаловаться, но решила вместо этого поговорить со своей командой.','Вместе они переписали график и три вечера работали допоздна.','К пятнице отчёт был готов, и клиент был так впечатлён, что предложил им новый контракт.','Лена поняла, что сохранять спокойствие часто полезнее, чем искать виноватого.'],
['Старый мост стоял над рекой два столетия, и почти никто не обращал на него внимания.','Только когда совет объявил о его сносе, жители деревни поняли, как много он для них значит.','Если бы с ними посоветовались раньше, они предложили бы реставрацию вместо дорогостоящей замены.','После месяцев кампании план был отозван не потому, что инженеры согласились, а потому, что люди не уступили.','Сегодня мост всё ещё стоит, напоминая, что наследие живёт лишь тогда, когда люди готовы его защищать.'],
['Изучение языка — это не столько накопление слов, сколько постепенное отучение от привычек собственного языка.','Каждая идиома, не поддающаяся переводу, обнажает предположение, которое мы никогда не думали подвергнуть сомнению.','Поэтому беглость — не отсутствие ошибок, а готовность быть непонятым и попробовать снова.','Спустя годы я всё ещё ловлю себя на том, что вижу сны фразами, не принадлежащими ни одному языку.','Возможно, именно это, больше любой грамматики, и значит по-настоящему прийти в другой язык.']]);
A('tr',[
['Bence evden çalışmak ofise gitmekten daha verimli.','Ne demek istediğini anlıyorum ama iş arkadaşlarımla yaptığım anlık sohbetleri özlüyorum.','Haklısın. Yine de yolculuk yapmadığım için günde iki saat kazanıyorum.','Doğru, ama işten sonra kafamı kapatmak benim için daha zor.','Belki karma bir düzende anlaşmalıyız: iki gün evde, üç gün ofiste.','Bu makul bir uzlaşma gibi duruyor. Hadi bunu müdürümüze önerelim.'],
['Lena projeyi dikkatle planlamış olsa da müşteri birdenbire gereksinimleri değiştirdi.','Şikâyet edebilirdi ama bunun yerine ekibiyle konuşmaya karar verdi.','Birlikte takvimi yeniden yazdılar ve üç akşam geç saate kadar çalıştılar.','Cuma gününe kadar rapor bitti ve müşteri o kadar etkilendi ki onlara yeni bir sözleşme teklif etti.','Lena, sakin kalmanın çoğu zaman suçlu aramaktan daha yararlı olduğunu öğrendi.'],
['Eski köprü iki yüzyıldır nehrin üzerinde duruyordu ve kimse ona pek dikkat etmiyordu.','Belediye yıkılacağını açıklayınca köylüler onun kendileri için ne kadar önemli olduğunu anladılar.','Kendilerine daha önce danışılsaydı pahalı bir yenileme yerine onarımı önerirlerdi.','Aylarca süren kampanyanın ardından plan geri çekildi; mühendisler razı olduğu için değil, halk geri adım atmadığı için.','Bugün köprü hâlâ ayakta; mirasın ancak insanlar onu savunmaya hazırsa yaşadığını hatırlatıyor.'],
['Dil öğrenmek, kelime biriktirmekten çok kendi dilinin alışkanlıklarını yavaş yavaş bırakmaktır.','Çeviriye direnen her deyim, hiç sorgulamayı düşünmediğimiz bir varsayımı ortaya çıkarır.','Bu yüzden akıcılık hatasız olmak değil, yanlış anlaşılmayı göze alıp yeniden denemektir.','Yıllar sonra bile kendimi hiçbir tek dile ait olmayan cümlelerle rüya görürken yakalıyorum.','Belki de başka bir dile gerçekten varmak, her dilbilgisinden çok bu demektir.']]);
A('ar',[
['أعتقد أن العمل من المنزل أكثر إنتاجية من الذهاب إلى المكتب.','أفهم وجهة نظرك، لكنني أفتقد الأحاديث العفوية مع الزملاء.','معك حق. ومع ذلك، أوفّر ساعتين يوميًا لأنني لا أتنقل.','هذا صحيح، لكن يصعب عليّ الانفصال عن العمل بعد انتهائه.','ربما يجب أن نتفق على نموذج مختلط: يومان في المنزل وثلاثة في المكتب.','يبدو هذا حلًا وسطًا معقولًا. لنقترحه على مديرنا.'],
['رغم أن لينا خططت للمشروع بعناية، غيّر العميل المتطلبات فجأة.','كان بإمكانها أن تشتكي، لكنها قررت أن تتحدث مع فريقها بدلًا من ذلك.','أعادوا معًا كتابة الجدول وعملوا حتى وقت متأخر ثلاث ليالٍ.','بحلول يوم الجمعة كان التقرير جاهزًا، وأُعجب العميل به كثيرًا حتى عرض عليهم عقدًا جديدًا.','تعلمت لينا أن الهدوء غالبًا أنفع من البحث عن شخص نلقي عليه اللوم.'],
['وقف الجسر القديم فوق النهر قرنين، وقلّما انتبه إليه أحد.','لم يدرك القرويون مدى أهميته لهم إلا عندما أعلن المجلس هدمه.','لو استُشيروا في وقت أبكر لاقترحوا الترميم بدلًا من استبدال باهظ التكلفة.','بعد أشهر من الحملة سُحبت الخطة، لا لأن المهندسين وافقوا، بل لأن الناس رفضوا التنازل.','لا يزال الجسر قائمًا اليوم، تذكيرًا بأن التراث لا يبقى إلا إذا كان الناس مستعدين للدفاع عنه.'],
['تعلّم اللغة ليس تكديس الكلمات بقدر ما هو التخلّي التدريجي عن عادات لغتنا الأم.','كل تعبير اصطلاحي يستعصي على الترجمة يكشف افتراضًا لم نفكر يومًا في مساءلته.','لذا فالطلاقة ليست غياب الأخطاء، بل الاستعداد لأن يُساء فهمنا ولأن نحاول من جديد.','بعد سنوات، ما زلت أجد نفسي أحلم بجمل لا تنتمي إلى لسان واحد.','ربما هذا، أكثر من أي قواعد، هو معنى أن تصل حقًا إلى لغة أخرى.']]);
A('az',[
['Məncə evdən işləmək ofisə getməkdən daha məhsuldardır.','Fikrini başa düşürəm, amma həmkarlarla spontan söhbətləri darıxıram.','Haqlısan. Amma yol getmədiyim üçün gündə iki saat qənaət edirəm.','Doğrudur, lakin işdən sonra özümü işdən ayırmaq mənə daha çətindir.','Bəlkə qarışıq modelə razılaşaq: iki gün evdə, üç gün ofisdə.','Bu, məntiqli kompromisə oxşayır. Gəl bunu rəhbərimizə təklif edək.'],
['Lena layihəni diqqətlə planlaşdırsa da, müştəri qəfildən tələbləri dəyişdi.','O, şikayət edə bilərdi, amma əvəzində komandası ilə danışmağa qərar verdi.','Birlikdə cədvəli yenidən yazdılar və üç axşam gec saatlara qədər işlədilər.','Cümə gününə qədər hesabat hazır oldu və müştəri o qədər təsirləndi ki, onlara yeni müqavilə təklif etdi.','Lena başa düşdü ki, sakit qalmaq çox vaxt günahkar axtarmaqdan daha faydalıdır.'],
['Köhnə körpü iki əsrdir çayın üstündə dururdu və az adam ona diqqət edirdi.','Bələdiyyə onun sökülməsini elan edəndə kəndlilər onun onlar üçün nə qədər əhəmiyyətli olduğunu anladılar.','Onlarla daha əvvəl məsləhətləşilsəydi, bahalı əvəzləmə əvəzinə bərpanı təklif edərdilər.','Aylarla davam edən kampaniyadan sonra plan geri götürüldü; mühəndislər razılaşdığı üçün yox, camaat güzəştə getmədiyi üçün.','Bu gün körpü hələ də ayaqdadır və xatırladır ki, irs yalnız insanlar onu müdafiə etməyə hazır olanda yaşayır.'],
['Dil öyrənmək söz yığmaqdan çox, öz dilinin vərdişlərini tədricən unutmaqdır.','Tərcüməyə müqavimət göstərən hər idiom, heç vaxt sorğulamağı düşünmədiyimiz bir fərziyyəni üzə çıxarır.','Buna görə də səlistlik səhvsizlik deyil, yanlış anlaşılmağa və yenidən cəhd etməyə hazır olmaqdır.','Illər sonra da özümü heç bir tək dilə aid olmayan cümlələrlə yuxu görərkən tuturam.','Bəlkə də başqa dilə həqiqətən çatmaq hər qrammatikadan çox bunu ifadə edir.']]);
A('hi',[
['मुझे लगता है कि घर से काम करना दफ़्तर जाने से ज़्यादा उत्पादक है।','मैं आपकी बात समझता हूँ, लेकिन मुझे सहकर्मियों के साथ अचानक होने वाली बातचीत की याद आती है।','ठीक है। फिर भी आने-जाने का समय बचने से मैं रोज़ दो घंटे बचा लेता हूँ।','यह सच है, हालाँकि काम के बाद काम से दिमाग़ हटाना मेरे लिए ज़्यादा मुश्किल होता है।','शायद हमें मिश्रित व्यवस्था पर सहमत होना चाहिए: दो दिन घर पर और तीन दिन दफ़्तर में।','यह एक उचित समझौता लगता है। चलो इसे अपने प्रबंधक को सुझाते हैं।'],
['हालाँकि लीना ने परियोजना की योजना ध्यान से बनाई थी, ग्राहक ने अचानक ज़रूरतें बदल दीं।','वह शिकायत कर सकती थी, पर उसने इसके बजाय अपनी टीम से बात करने का फ़ैसला किया।','उन्होंने मिलकर समय-सारणी दोबारा लिखी और तीन शामें देर तक काम किया।','शुक्रवार तक रिपोर्ट तैयार हो गई, और ग्राहक इतना प्रभावित हुआ कि उसने उन्हें नया अनुबंध दे दिया।','लीना ने सीखा कि शांत रहना अक्सर किसी को दोषी ढूँढ़ने से ज़्यादा उपयोगी होता है।'],
['पुराना पुल दो सदियों से नदी के ऊपर खड़ा था, और बहुत कम लोग उस पर ध्यान देते थे।','जब परिषद ने उसे गिराने की घोषणा की, तभी गाँव वालों को एहसास हुआ कि वह उनके लिए कितना मायने रखता है।','अगर उनसे पहले सलाह ली गई होती, तो वे महँगे नए पुल की जगह मरम्मत का सुझाव देते।','महीनों के अभियान के बाद योजना वापस ले ली गई, इसलिए नहीं कि इंजीनियर सहमत हुए, बल्कि इसलिए कि जनता पीछे नहीं हटी।','आज पुल अब भी खड़ा है, याद दिलाता हुआ कि विरासत तभी बचती है जब लोग उसकी रक्षा करने को तैयार हों।'],
['भाषा सीखना शब्द जमा करने से ज़्यादा अपनी भाषा की आदतों को धीरे-धीरे भुलाना है।','हर मुहावरा जो अनुवाद का विरोध करता है, एक ऐसी धारणा उजागर करता है जिस पर हमने कभी सवाल उठाने की सोची ही नहीं थी।','इसलिए प्रवाह का मतलब ग़लतियों का न होना नहीं, बल्कि ग़लत समझे जाने और फिर कोशिश करने की तत्परता है।','बरसों बाद भी मैं ख़ुद को ऐसे वाक्यों में सपने देखते पाता हूँ जो किसी एक भाषा के नहीं हैं।','शायद किसी दूसरी भाषा में सचमुच पहुँचने का अर्थ किसी भी व्याकरण से ज़्यादा यही है।']]);
A('ja',[
['在宅勤務のほうが出社するより生産的だと思います。','おっしゃることは分かりますが、同僚との何気ない会話が恋しいです。','確かにそうですね。でも通勤しない分、一日二時間節約できます。','その通りですが、仕事の後に気持ちを切り替えるのが難しいと感じます。','ハイブリッド型にしてはどうでしょう。二日は在宅、三日は出社です。','妥当な折衷案ですね。上司に提案してみましょう。'],
['レナはプロジェクトを丁寧に計画していたが、客は突然要件を変更した。','彼女は文句を言うこともできたが、代わりにチームと話し合うことにした。','みんなで日程を書き直し、三晩遅くまで働いた。','金曜日までに報告書は完成し、客は感心して新しい契約を申し出た。','レナは、落ち着いていることのほうが、責める相手を探すよりしばしば役に立つと学んだ。'],
['古い橋は二世紀にわたって川に架かっていたが、気に留める人はほとんどいなかった。','町が取り壊しを発表して初めて、村人たちはそれが自分たちにとってどれほど大切かに気づいた。','もっと早く意見を聞かれていれば、高額な架け替えではなく修復を提案していただろう。','何か月もの運動の末、計画は撤回された。技術者が同意したからではなく、住民が譲らなかったからだ。','今も橋は残り、遺産は人々が守ろうとする時にだけ生き残ることを思い出させる。'],
['言語を学ぶとは、単語を増やすことよりも、自分の言語の癖を少しずつ手放していくことだ。','翻訳に抗うあらゆる慣用句は、これまで疑おうと思わなかった前提をあらわにする。','だから流暢さとは間違いのないことではなく、誤解される覚悟を持ち、もう一度挑戦することだ。','何年も経った今も、どの言語にも属さない文で夢を見ている自分に気づく。','おそらくそれこそが、どんな文法よりも、別の言語に本当にたどり着いたということなのだろう。']]);
A('ko',[
['저는 재택근무가 사무실에 출근하는 것보다 더 생산적이라고 생각해요.','무슨 말인지 알겠지만, 동료들과 나누던 자연스러운 대화가 그리워요.','맞아요. 하지만 출퇴근을 안 해서 하루에 두 시간을 아끼고 있어요.','맞는 말이에요, 다만 퇴근 후에 일에서 벗어나기가 더 힘들어요.','어쩌면 혼합 방식으로 합의해야 할지도 몰라요. 이틀은 집에서, 사흘은 사무실에서요.','합리적인 절충안 같네요. 팀장님께 제안해 봐요.'],
['레나는 프로젝트를 꼼꼼히 계획했지만, 고객이 갑자기 요구 사항을 바꿨다.','그녀는 불평할 수도 있었지만, 대신 팀원들과 이야기하기로 했다.','그들은 함께 일정을 다시 짜고 사흘 밤 늦게까지 일했다.','금요일까지 보고서가 완성되었고, 고객은 깊은 인상을 받아 새 계약을 제안했다.','레나는 침착함을 유지하는 것이 탓할 사람을 찾는 것보다 더 유용할 때가 많다는 것을 배웠다.'],
['낡은 다리는 두 세기 동안 강 위에 서 있었지만, 눈여겨보는 사람은 거의 없었다.','시의회가 철거를 발표하고 나서야 마을 사람들은 그 다리가 자신들에게 얼마나 소중한지 깨달았다.','더 일찍 의견을 물었다면, 그들은 값비싼 교체 대신 복원을 제안했을 것이다.','몇 달간의 운동 끝에 계획은 철회되었다. 기술자들이 동의해서가 아니라 주민들이 물러서지 않았기 때문이다.','오늘도 다리는 남아 있으며, 유산은 사람들이 지키려 할 때에만 살아남는다는 것을 일깨워 준다.'],
['언어를 배운다는 것은 단어를 쌓는 일이라기보다 자기 언어의 습관을 서서히 버리는 일이다.','번역에 저항하는 모든 관용구는 우리가 의심해 볼 생각조차 하지 못한 전제를 드러낸다.','그래서 유창함이란 실수가 없는 것이 아니라 오해받을 각오를 하고 다시 시도하는 것이다.','몇 년이 지난 지금도 나는 어느 한 언어에도 속하지 않는 문장으로 꿈을 꾸는 나를 발견한다.','어쩌면 어떤 문법보다도 그것이 다른 언어에 진정으로 도착했다는 뜻일지도 모른다.']]);
A('zh',[
['我认为在家办公比去办公室更有效率。','我明白你的意思，但我很怀念和同事之间随意的聊天。','有道理。不过因为不用通勤，我每天能节省两个小时。','没错，不过下班后我更难让自己从工作中抽离出来。','也许我们应该商定一种混合模式：两天在家，三天在办公室。','这听起来是个合理的折中。我们向经理提议一下吧。'],

    ${sy||an?`<div class="wsa">${sy?'≈ '+esc(sy):''}${sy&&an?' · ':''}${an?'≠ '+esc(an):''}</div>`:''}

  o.innerHTML=`<button class="rclose" aria-label="close">✕</button><div class="rpager">${cs.map(page).join('')}</div>`;
